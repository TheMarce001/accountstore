const TITULOS = { venc: 'Vencimientos', clientes: 'Clientes', cuentas: 'Cuentas', nuevo: 'Nuevo cliente' };
function cambiarVista(v) {
  S.vista = v;
  document.querySelectorAll('.vista').forEach(el => el.classList.toggle('activa', el.id === 'v-' + v));
  document.querySelectorAll('.tab').forEach(el => el.setAttribute('aria-selected', String(el.dataset.v === v)));
  $('#titulo').textContent = TITULOS[v];
  window.scrollTo(0, 0);
  if (!S.cargado) return;
  if (v === 'venc') renderVenc();
  if (v === 'clientes') renderClientes();
  if (v === 'cuentas') renderCuentas();
  if (v === 'nuevo') { if (!$('#fNuevo') && !$('#nuevoCuerpo').innerHTML) renderNuevo(); $('#subtitulo').textContent = 'Se agrega al final de BasedeDatos'; }
}
function renderTodo() { renderVenc(); renderClientes(); renderCuentas(); if (S.vista === 'nuevo') $('#subtitulo').textContent = 'Se agrega al final de BasedeDatos'; }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-accion]');
  if (!el) return;
  const a = el.dataset.accion, d = el.dataset;
  if (el.tagName === 'A' && (a === 'copiar-txt')) e.preventDefault();
  switch (a) {
    case 'vista': cambiarVista(d.v); break;
    case 'cerrar': hoja.cerrar(); break;
    case 'actualizar': cargar(true); break;
    case 'sesion': abrirMenuUsuario(); break;
    case 'tema': tema.aplicar(tema.oscuro() ? 'claro' : 'oscuro'); break;
    case 'tema-fijar': tema.aplicar(d.t); break;
    case 'cerrar-sesion': hoja.cerrar(); setTimeout(cerrarSesion, 230); break;
    case 'menu-actualizar': hoja.cerrar(); cargar(true); break;
    case 'huella-desbloquear': desbloquearConHuella(); break;
    case 'huella-pin': $('#bloqueo').hidden = true; mostrarLogin('Entrá con tu PIN para desbloquear.'); break;
    case 'ir-venc': S.filtroVenc = d.f; renderVenc(); document.getElementById('chipsVenc').scrollIntoView({ block: 'start', behavior: 'smooth' }); break;
    case 'ir-cuentas': cambiarVista('cuentas'); break;
    case 'ir-pend': cambiarVista('cuentas'); S.fPend = d.f; abrirPendientes(); break;
    case 'filtro-venc': S.filtroVenc = d.f; renderVenc(); break;
    case 'filtro-cli': S.filtroCli = d.f; S.limCli = 50; renderClientes(); break;
    case 'mas-cli': S.limCli += 50; renderClientes(); break;
    case 'detalle': abrirDetalle(d.row, hoja.abierta); break;
    case 'renovar': abrirRenovar(d.row); break;
    case 'reactivar': abrirReactivar(d.row, d.origen); break;
    case 'editar': abrirEditar(d.row); break;
    case 'baja': abrirBaja(d.row); break;
    case 'pass-lugar': passDeLugar(d.hoja, d.fila); break;
    case 'pendientes': abrirPendientes(); break;
    case 'f-pend': S.fPend = d.f; renderPendientes(); break;
    case 'volver-pend': hoja.cambiar(cabHoja('Pendientes', 'Cuentas para cerrar y lugares para liberar') + '<div id="pendCuerpo"></div>'); renderPendientes(); break;
    case 'pend-pass': abrirPassPend(Number(d.h), Number(d.c)); break;
    case 'pend-liberar': { const h = S.pend[Number(d.h)], c = h.cuentas[Number(d.c)]; liberarPend(Number(d.h), [{ p: c.slots[Number(d.s)], c }]); break; }
    case 'pend-liberar-hoja': { const h = S.pend[Number(d.h)]; const lista = []; h.cuentas.forEach(c => c.slots.forEach(p => { if (!p.libre && (p.baja || p.noEsta)) lista.push({ p, c }); })); liberarPend(Number(d.h), lista); break; }
    case 'ubicar': ubicar(d.row); break;
    case 'ir-lugar': irALugar(d.hoja, d.row); break;
    case 'asignar-cliente': empezarAsignar(d.row); break;
    case 'cancelar-asignar': S.asignando = null; S.fCuentas = 'todas'; renderCuentas(); break;
    case 'copiar-txt': copiar(d.t); break;
    case 'hoja': S.fCuentas = S.asignando ? 'libres' : 'todas'; S.qCuentas = ''; S.limCuentas = 25; S.hojaSel === d.h ? renderCuentas() : cargarHoja(d.h); break;
    case 'f-cuentas': S.fCuentas = d.f; S.limCuentas = 25; renderListaCuentas(); break;
    case 'mas-cuentas': S.limCuentas += 25; renderListaCuentas(); break;
    case 'copiar-cuenta': { const c = cuentaSel(d.i); copiar(d.v === 'pass' ? c.pass : d.v === 'aviso' ? c.aviso : c.correo); break; }
    case 'ver-pass': { const sp = el.querySelector('[data-pass]'); const c = cuentaSel(d.i); sp.textContent = sp.textContent === c.pass ? '••••••••' : c.pass; break; }
    case 'lugar': abrirLugar(d.i, d.j); break;
    case 'elegir-asignar': { const c = S.porRow.get(Number(d.row)); asignar(d.i, d.j, c.nombre); break; }
    case 'liberar': liberar(d.i, d.j); break;
    case 'cambiar-pass': abrirCambiarPass(d.i); break;
    case 'emoji': { const f = el.closest('form'); if (f.id === 'fNuevo') f.dataset.auto = '0'; aplicarEmoji(f, d.e); break; }
    case 'add-serv': { const f = el.closest('form'); agregarServicio(f, d.s); const box = f.querySelector('#cServVar'); if (box) box.innerHTML = ''; break; }
    case 'usar-datos': usarDatos(el.closest('form'), d.row); break;
    case 'ver-coincidencias': { const f = el.closest('form'); delete f.dataset.copiadoDe; revisarExistentes(f); break; }
    case 'serv-grupo': {
      const f = el.closest('form'), g = catalogoServicios()[Number(d.g)], box = f.querySelector('#cServVar');
      if (g.vars.length === 1) { box.innerHTML = ''; agregarServicio(f, g.vars[0]); break; }
      box.innerHTML = `<div class="variantes"><p>¿Qué tipo de ${esc(g.nombre)}?</p><div class="sugs">${g.vars.map(v => `<button type="button" class="sug" data-accion="add-serv" data-s="${esc(v)}">${esc(v)}</button>`).join('')}</div></div>`;
      break;
    }
    case 'serv-mas': cambiarServicio(el.closest('form'), Number(d.k), 1); break;
    case 'serv-menos': cambiarServicio(el.closest('form'), Number(d.k), -1); break;
    case 'serv-quitar': cambiarServicio(el.closest('form'), Number(d.k), 0); break;
    case 'nuevo-otro': $('#nuevoCuerpo').innerHTML = ''; renderNuevo(); break;
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'fLogin') entrarPIN(f);
  if (f.id === 'fBaja') guardarBaja(f);
  if (f.id === 'fPassPend') guardarPassPend(f);
  if (f.id === 'fRenovar') guardarRenovar(f);
  if (f.id === 'fNuevo') guardarNuevo(f);
  if (f.id === 'fEditar') guardarEditar(f);
  if (f.id === 'fReactivar') guardarReactivar(f);
  if (f.id === 'fPass') guardarPass(f);
});

let tBusca;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'pin') { pintarPin(); $('#loginError').textContent = ''; if (t.value.length === 6 && !t.form.dataset.enviando) setTimeout(() => t.form.requestSubmit(), 120); return; }
  const campoFalta = t.closest && t.closest('.campo.falta');
  if (campoFalta) campoFalta.classList.remove('falta');
  if (t.hasAttribute('data-miles')) { const d = digitos(t.value); t.value = d ? miles(Number(d)) : ''; }
  if (t.id === 'qClientes') { clearTimeout(tBusca); tBusca = setTimeout(() => { S.q = t.value; S.limCli = 50; renderClientes(); }, 120); }
  if (t.id === 'qCuentas') { clearTimeout(tBusca); tBusca = setTimeout(() => { S.qCuentas = t.value; S.limCuentas = 25; renderListaCuentas(); }, 150); }
  if (t.id === 'qAsignar') renderPicker(t.dataset.i, t.dataset.j, t.value);
  const f = t.form;
  if (f && f.id === 'fRenovar') previaRenovar();
  if (f && f.id === 'fBaja' && t.name === 'dias') ayudaDias(f);
  if (f && f.id === 'fNuevo') {
    if (t.name === 'telefono' && !f.pin.dataset.tocado) { const d = telNormal(t.value); f.pin.value = d.length >= 4 ? d.slice(-4) : ''; }
    if (t.name === 'pin') f.pin.dataset.tocado = '1';
    if (t.name === 'nombre' || t.name === 'telefono') revisarExistentes(f);
    if (t.name === 'nombre') { const m = t.value.trim().match(RX_EMOJI_FIN); if (m && m[0] !== f.dataset.finAuto) f.dataset.auto = '0'; if (!t.value.trim()) f.dataset.auto = ''; }
  }
  const esCli = f && ['fNuevo', 'fEditar', 'fReactivar'].includes(f.id);
  if (esCli && (t.name === 'fecha' || t.name === 'meses')) previaForm(f);
  if (esCli && t.name === 'servicios') renderServicios(f);
  if (esCli && t.name === 'nombre') revisarNombre(f, f.dataset.row ? Number(f.dataset.row) : -1);
  if (f && f.id === 'fEditar' && t.name === 'baja') f.fecha.disabled = t.checked;
});
document.addEventListener('change', e => {
  const t = e.target, f = t.form;
  if (t.id === 'chkHuella') { cambiarHuella(t); return; }
  if (f && f.id === 'fEditar' && t.name === 'baja') { f.fecha.disabled = t.checked; if (!t.checked && !f.fecha.value) f.fecha.value = S.hoy; }
  if (f && f.id === 'fRenovar') previaRenovar();
  if (emojiAuto(f) && (t.name === 'nombre' || t.name === 'servicios')) aplicarEmoji(f);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && hoja.abierta) hoja.cerrar(); });

/* ================================================================
   Carga
   ================================================================ */
/*
 * Copia local de los datos: la app abre al instante con lo último que vio y se
 * actualiza por detrás. Se borra al cerrar sesión.
 */
const CLAVE_DATOS = 'as_datos_v1';
const datosLocales = {
  leer() { try { return JSON.parse(localStorage.getItem(CLAVE_DATOS) || 'null'); } catch (e) { return null; } },
  guardar(parte) { try { localStorage.setItem(CLAVE_DATOS, JSON.stringify(Object.assign(this.leer() || {}, parte))); } catch (e) { } },
  borrar() { try { localStorage.removeItem(CLAVE_DATOS); } catch (e) { } }
};
const hoyDispositivo = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
function horaDe(ts) {
  const d = new Date(ts), hh = d.toTimeString().slice(0, 5);
  return d.toDateString() === new Date().toDateString() ? 'de hoy ' + hh : 'del ' + d.toLocaleDateString('es-PY') + ' ' + hh;
}
function aplicarInicial(d, desfase = 0) {
  S.hoy = desfase ? hoyDispositivo() : d.hoy; S.leyenda = d.leyenda; S.msgs = d.msgs;
  S.usuario = d.usuario || S.usuario; S.rol = d.rol || ''; S.permisos = d.permisos || {}; S.reglas = d.reglas || S.reglas; mostrarUsuario();
  S.perfilAuto = d.perfilAuto !== false;
  S.clientes = d.clientes.map(dec);
  if (desfase) S.clientes.forEach(c => { if (typeof c.dias === 'number') c.dias -= desfase; });
  S.bajasCargadas = false;
  indexar();
  S.cargado = true;
}
function sumarBajas(lista) {
  const nuevos = lista.map(dec).filter(c => !S.porRow.has(c.row));
  S.clientes = S.clientes.concat(nuevos);
  S.bajasCargadas = true;
  indexar();
  if (S.vista === 'clientes') renderClientes();
  const fn = $('#fNuevo');
  if (emojiAuto(fn) && fn.dataset.finAuto) aplicarEmoji(fn); else revisarExistentes(fn);
}

async function cargar(forzar = false, silencioso = false) {
  let lento, local = null;
  try {
    if (!S.cargado) {
      local = datosLocales.leer();
      if (local && local.inicial) {
        // Mostrar ya lo último guardado, corrigiendo los días si pasó la medianoche
        const [a1, m1, d1] = local.inicial.hoy.split('-').map(Number), [a2, m2, d2] = hoyDispositivo().split('-').map(Number);
        const desfase = Math.round((Date.UTC(a2, m2 - 1, d2) - Date.UTC(a1, m1 - 1, d1)) / 864e5);
        aplicarInicial(local.inicial, desfase);
        if (local.bajas) sumarBajas(local.bajas);
        if (local.servicios) { S.servicios = local.servicios; S.serviciosCargados = true; }
        if (local.resumen) S.resumen = local.resumen;
        cambiarVista(S.vista);
        ocultarSplash();
        $('#subtitulo').textContent = `Datos ${horaDe(local.ts)}, actualizando…`;
      } else {
        $('#listaVenc').innerHTML = '<div class="esqueleto"></div>'.repeat(6);
        lento = setTimeout(() => { if (!S.cargado) $('#subtitulo').textContent = 'La planilla está tardando en responder…'; }, 12000);
      }
    }
    const d = await api('getInicial');
    const bajasPrevias = local && local.bajas;
    aplicarInicial(d);
    datosLocales.guardar({ inicial: d, ts: Date.now() });
    if (bajasPrevias) S.bajasCargadas = false;
    if (forzar) { S.cacheServ = {}; S.servViejo = {}; }
    cambiarVista(S.vista);
    ocultarSplash();
    if (forzar && !silencioso) toast('Datos actualizados');
    if (forzar || !S.resumen || Date.now() - (S.resumen.ts || 0) > 10 * 60000) pedirResumen();

    // En segundo plano: la lista de hojas de servicio y los dados de baja
    api('getServiciosLista', forzar).then(lista => {
      S.servicios = lista; S.serviciosCargados = true;
      datosLocales.guardar({ servicios: lista });
      if (S.vista === 'cuentas') {
        if (S.asignando && !S.hojaSel) { const h = adivinarHoja(S.asignando.servicios); if (h) return cargarHoja(h); }
        forzar && S.hojaSel ? cargarHoja(S.hojaSel, true) : renderCuentas();
      }
    }).catch(e => toast(msgError(e), true));
    api('getBajas').then(lista => {
      datosLocales.guardar({ bajas: lista });
      sumarBajas(lista);
    }).catch(e => toast('No se pudieron cargar los dados de baja: ' + msgError(e), true));
  } catch (e) {
    ocultarSplash();
    if (!S.token) return;   // se venció la sesión: ya se muestra la pantalla de PIN
    if (S.cargado && local && local.inicial) {
      $('#subtitulo').textContent = `Sin conexión: datos ${horaDe(local.ts)}`;
      toast(msgError(e), true);
      return;
    }
    $('#subtitulo').textContent = 'No se pudo leer la planilla';
    $('#listaVenc').innerHTML = `<li class="vacio"><strong>No se pudo leer la planilla</strong>${esc(msgError(e))}<br><button class="btn mas" data-accion="actualizar">Reintentar</button></li>`;
  } finally { clearTimeout(lento); }
}

document.querySelectorAll('[data-ico]').forEach(el => el.outerHTML = ICON[el.dataset.ico]);
const medirTop = () => document.documentElement.style.setProperty('--top-h', 'env(safe-area-inset-top, 0px)');
medirTop(); addEventListener('resize', medirTop);
$('#btnActualizar').innerHTML = ICON.actualizar;
$('#icoBusca').outerHTML = ICON.buscar;
pintarMarca();
pintarBotonTema();
pintarPin();
$('#linkAdmin').href = 'https://wa.me/' + WHATSAPP_ADMIN + '?text=' + encodeURIComponent('Hola, necesito mi PIN para la app de AccountStore.');
$('#pin').addEventListener('focus', () => $('#pinZona').classList.add('enfocado'));
$('#pin').addEventListener('blur', () => $('#pinZona').classList.remove('enfocado'));
S.token = sesionGuardada.get();
if (S.token) {
  S.usuario = infoSesion(S.token).usuario || '';
  mostrarSplash();
  if (huella.id() && !EN_APPS_SCRIPT) bloquear();
  cargar();
} else mostrarLogin();
if (!EN_APPS_SCRIPT && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => { });
}
</script>
