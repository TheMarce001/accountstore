<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AccountStore">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1EF; --surface:#FFFFFF; --surface-2:#F6F8F7; --ink:#16202A; --muted:#5B6873; --line:#DCE2E0;
  --primary:#0E6B66; --primary-ink:#FFFFFF; --primary-soft:#DDEFEC;
  --venc:#C2372E; --venc-soft:#FBE4E1; --venc-ink:#9E2920;
  --hoy:#D4700F; --pronto-soft:#FCEFD3; --pronto-ink:#855300;
  --semana-soft:#E2EEF6; --semana-ink:#24597D;
  --ok-soft:#E1F0E6; --ok-ink:#22613B;
  --baja-soft:#E8EBEC; --baja-ink:#66727C;
  --wa:#1C9F54; --wa-ink:#FFFFFF;
  --sombra:0 1px 2px rgba(22,32,42,.06), 0 6px 20px rgba(22,32,42,.08);
  --r-s:8px; --r-m:12px; --r-l:18px;
  --nav-h:64px;
  font-family:'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0E1316; --surface:#172026; --surface-2:#1C262D; --ink:#E4EAED; --muted:#91A0AA; --line:#27333B;
    --primary:#3DB2A8; --primary-ink:#06201E; --primary-soft:#173A37;
    --venc:#E0584E; --venc-soft:#3A1D1B; --venc-ink:#F4A39C;
    --hoy:#E88A2C; --pronto-soft:#3A2D14; --pronto-ink:#F0C473;
    --semana-soft:#18303F; --semana-ink:#94C3E3;
    --ok-soft:#173127; --ok-ink:#8FD3A8;
    --baja-soft:#232C33; --baja-ink:#8E9AA3;
    --wa:#25B864; --wa-ink:#04210F;
    --sombra:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* Estructura */
.app{display:flex;flex-direction:column;min-height:100dvh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--paper);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:12px}
.top-txt{flex:1;min-width:0}
.top h1{margin:0;font-size:1.5rem;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.top p{margin:2px 0 0;color:var(--muted);font-size:.875rem}
.barra{position:fixed;top:0;left:0;right:0;height:3px;z-index:50;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .2s}
.barra.on{opacity:1}
.barra::after{content:"";position:absolute;inset:0;width:40%;background:var(--primary);animation:carga 1s ease-in-out infinite}
@keyframes carga{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
main{flex:1}
.vista{display:none;padding:0 12px 24px}
.vista.activa{display:block}

/* Navegación */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{height:var(--nav-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:.75rem;font-weight:500;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--primary)}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--primary)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.9375rem;text-decoration:none;color:var(--ink)}
.btn svg{width:20px;height:20px;flex:none}
.btn-pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn-wa{background:var(--wa);border-color:var(--wa);color:var(--wa-ink)}
.btn-bloque{width:100%}
.btn:disabled{opacity:.55}
.ic{width:44px;height:44px;border-radius:50%;border:0;background:none;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);text-decoration:none;flex:none}
.ic svg{width:22px;height:22px}
.ic-wa{color:var(--wa)}
.link{border:0;background:none;padding:12px 4px;text-align:left;font-weight:600;color:var(--primary);font-size:.9375rem}
.link.peligro{color:var(--venc)}

/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 10px;margin:0 -12px;padding-left:12px;padding-right:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.875rem;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip b{font-weight:700;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.c-vencido b{color:var(--venc)}
.chip.c-hoy b{color:var(--hoy)}
.chip[aria-pressed="true"] b{color:inherit}

/* Listas de clientes */
.lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.fila{display:flex;align-items:center;background:var(--surface);border-radius:var(--r-m);padding-right:4px}
.fila-main{flex:1;min-width:0;display:flex;align-items:stretch;gap:12px;border:0;background:none;text-align:left;padding:10px 4px 10px 10px}
.fila-txt{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px}
.nom{font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:.875rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:12px;font-size:.8125rem;color:var(--muted);font-variant-numeric:tabular-nums}
.fila-acc{display:flex;align-items:center}

/* La columna de días: el dato que manda */
.dias{flex:none;width:52px;border-radius:var(--r-s);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;font-variant-numeric:tabular-nums}
.dias b{font-size:1.375rem;line-height:1;font-weight:700;letter-spacing:-.02em}
.dias small{font-size:.6875rem;margin-top:3px;font-weight:500}
.t-vencido{background:var(--venc);color:#fff}
.t-hoy{background:var(--hoy);color:#fff}
.t-pronto{background:var(--pronto-soft);color:var(--pronto-ink)}
.t-semana{background:var(--semana-soft);color:var(--semana-ink)}
.t-ok{background:var(--ok-soft);color:var(--ok-ink)}
.t-baja,.t-sin{background:var(--baja-soft);color:var(--baja-ink)}

.vacio{padding:40px 16px;text-align:center;color:var(--muted)}
.vacio strong{display:block;color:var(--ink);font-size:1.0625rem;margin-bottom:4px}
.mas{margin:12px auto 0;display:flex}

/* Buscador */
.buscador{position:sticky;top:var(--top-h,66px);z-index:4;background:var(--paper);padding:2px 0 8px}
.campo-busca{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:0 12px;min-height:48px}
.campo-busca svg{width:20px;height:20px;color:var(--muted);flex:none}
.campo-busca input{flex:1;border:0;background:none;outline:none;font-size:1rem;min-width:0;padding:12px 0}

/* Hojas de servicio */
.resumen{font-size:.875rem;color:var(--muted);margin:2px 4px 10px}
.cuenta{background:var(--surface);border-radius:var(--r-l);padding:14px 14px 6px;margin-bottom:10px;scroll-margin-top:calc(var(--top-h,66px) + 64px)}
.cuenta.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--primary)}100%{box-shadow:0 0 0 0 transparent}}
.cuenta-cab{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.cuenta-cab h3{margin:0;font-size:1.0625rem;font-weight:700}
.cuenta-cab p{margin:1px 0 0;font-size:.8125rem;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.pill{font-size:.75rem;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.libre{background:var(--primary-soft);color:var(--primary)}
.cred{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cred-item{display:inline-flex;align-items:center;gap:8px;max-width:100%;min-height:36px;border:0;border-radius:var(--r-s);background:var(--surface-2);padding:0 10px;font-size:.875rem}
.cred-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cred-item svg{width:16px;height:16px;flex:none;color:var(--muted)}
.cuenta-meta{margin:8px 0 0;font-size:.8125rem;color:var(--muted)}
.lugares{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.lugar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:6px 2px}
.lugares li:last-child .lugar{border-bottom:0}
.lugar-nom{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.lugar.libre .lugar-nom{color:var(--muted);font-weight:400}
.lugar-acc{font-size:.8125rem;font-weight:600;color:var(--primary)}
.mini{flex:none;font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
.alerta{font-style:normal;font-size:.75rem;color:var(--venc);font-weight:600;margin-left:6px}
.cuenta-pie{display:flex;flex-wrap:wrap;gap:0 16px;border-top:1px solid var(--line)}
.cuenta-pie:empty{display:none}
.pill.inactiva{background:var(--baja-soft);color:var(--baja-ink)}
.cuenta.inactiva{opacity:.8}
.pill.cerrar{background:var(--venc-soft);color:var(--venc-ink)}
.marca-cerrar{flex:none;font-size:.6875rem;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--venc-soft);color:var(--venc-ink);margin-left:6px}
.lugar-der{display:flex;align-items:center;gap:4px;flex:none}
.tarjeta > .etq{font-size:.875rem;font-weight:600}
.pend-hoja{margin-bottom:18px}
.pend-hoja > h3{margin:4px 2px 8px;font-size:1rem}
.pend-fila{display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid var(--line);padding:6px 2px}
.pend-fila:last-child{border-bottom:0}
.pend-fila > span{flex:1;min-width:0}
.pend-fila b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pend-fila small{color:var(--muted);font-size:.8125rem}
.btn-pend{width:100%;margin-bottom:10px;justify-content:space-between}
.btn-pend b{background:var(--venc);color:#fff;border-radius:999px;padding:1px 9px;font-size:.8125rem}
.lugar.marcado{background:var(--primary-soft)}
.banner{position:sticky;top:var(--top-h,66px);z-index:4;display:flex;align-items:center;gap:10px;background:var(--primary);color:var(--primary-ink);border-radius:var(--r-m);padding:10px 8px 10px 14px;margin-bottom:10px;font-size:.9375rem}
.banner span{flex:1}
.banner button{border:0;background:rgba(255,255,255,.18);color:inherit;border-radius:var(--r-s);min-height:36px;padding:0 12px;font-weight:600}

/* Formularios */
.form{display:flex;flex-direction:column;gap:14px}
.form .tarjeta{background:var(--surface);border-radius:var(--r-l);padding:14px;display:flex;flex-direction:column;gap:14px}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label,.campo .etq{font-size:.875rem;font-weight:600}
.campo input,.campo select{min-height:48px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);padding:0 12px;font-size:1rem;width:100%}
.campo input:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
.ayuda{font-size:.8125rem;color:var(--muted)}
.campo .error{font-size:.8125rem;color:var(--venc);font-weight:600}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sugs{display:flex;gap:6px;overflow-x:auto;margin:0 -14px;padding:2px 14px;scrollbar-width:none}
.sugs::-webkit-scrollbar{display:none}
.sugs.dosfilas{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:max-content}
.variantes{background:var(--surface-2);border-radius:var(--r-m);padding:10px;display:flex;flex-direction:column;gap:8px}
.variantes p{margin:0;font-size:.8125rem;color:var(--muted)}
.variantes .sugs{flex-wrap:wrap;margin:0;padding:0;overflow:visible}
.variantes .sug{background:var(--surface)}
.sug{flex:none;white-space:nowrap;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:.8125rem}
.pservs{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.pserv{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);padding:2px 2px 2px 12px;font-size:.875rem}
.pserv b{font-weight:600;margin-right:4px}
.pserv i{font-style:normal;font-weight:700;min-width:16px;text-align:center;font-variant-numeric:tabular-nums}
.pserv button{width:30px;height:30px;border:0;border-radius:50%;background:none;color:var(--muted);font-size:1rem;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.pserv button.quitar{color:var(--venc)}
.meses{display:flex;gap:6px}
.meses label{flex:1}
.meses input{position:absolute;opacity:0;pointer-events:none}
.meses span{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid var(--line);border-radius:var(--r-m);font-weight:600;background:var(--surface)}
.meses input:checked + span{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.meses input:focus-visible + span{outline:2px solid var(--primary);outline-offset:2px}
.modos{display:flex;flex-direction:column;gap:6px}
.modo{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r-m);padding:12px;background:var(--surface)}
.modo input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--primary);flex:none}
.modo b{display:block;font-weight:600}
.modo small{color:var(--muted);font-size:.8125rem;font-weight:400;display:block;margin-top:2px}
.modo:has(input:checked){border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.check{display:flex;align-items:center;gap:10px;font-size:.9375rem;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--primary)}
.existe{border:1px solid var(--primary);background:var(--primary-soft);border-radius:var(--r-m);padding:10px}
.existe p{margin:0 2px 8px;font-size:.875rem}
.existe ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.existe li{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r-s);padding:8px}
.existe .dias{width:44px;padding:4px 0}
.existe .dias b{font-size:1.125rem}
.ex-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.ex-txt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-txt small{color:var(--muted);font-size:.8125rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-usar{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:0}
.existe .ex-ayuda{font-size:.8125rem;color:var(--muted);font-weight:400}
.req{color:var(--venc);margin-left:2px}
.campo.falta input{border-color:var(--venc);box-shadow:0 0 0 3px var(--venc-soft)}
.campo.falta label{color:var(--venc)}
.campo input[readonly]{background:var(--surface-2);color:var(--muted)}
.btn-sm{min-height:38px;padding:0 12px;font-size:.875rem;flex:none}
.previa{background:var(--surface-2);border-radius:var(--r-m);padding:12px 14px;font-size:.9375rem}
.previa b{font-size:1.125rem}

/* Hoja inferior */
.hoja{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.hoja-fondo{position:absolute;inset:0;background:rgba(10,16,20,.45);opacity:0;transition:opacity .2s}
.hoja-panel{position:relative;width:100%;max-width:640px;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--paper);border-radius:var(--r-l) var(--r-l) 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.hoja.abierta .hoja-fondo{opacity:1}
.hoja.abierta .hoja-panel{transform:none}
.asa{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.hoja-cab{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.hoja-tit{flex:1;min-width:0}
.hoja-cab h2{margin:0;font-size:1.25rem;line-height:1.2;font-weight:700;overflow-wrap:anywhere}
.hoja-cab p{margin:2px 0 0;color:var(--muted);font-size:.875rem}
.acciones{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.acciones .ancho{grid-column:1 / -1}
.datos{background:var(--surface);border-radius:var(--r-l);margin:0 0 10px;padding:4px 14px}
.datos div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.datos div:last-child{border-bottom:0}
.datos dt{color:var(--muted);font-size:.875rem;flex:none}
.datos dd{margin:0;text-align:right;font-weight:500;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.datos a{color:var(--primary);text-decoration:none}
.secundarias{display:flex;flex-direction:column;align-items:flex-start}
.ubic{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;width:100%}
.ubic button{width:100%;text-align:left;border:0;border-radius:var(--r-m);background:var(--surface);padding:12px 14px;display:flex;justify-content:space-between;gap:10px}
.ubic small{color:var(--muted)}
.exito{text-align:center;padding:8px 0 4px}
.exito .marca{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok-ink);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.exito .marca svg{width:28px;height:28px}
.exito h2{margin:0 0 4px;font-size:1.25rem}
.exito p{margin:0 0 16px;color:var(--muted)}
.pila{display:flex;flex-direction:column;gap:8px}

/* Confirmación y avisos */
.confirma{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(10,16,20,.5)}
.confirma-caja{background:var(--surface);border-radius:var(--r-l);padding:20px;width:100%;max-width:420px;max-height:88dvh;overflow-y:auto;box-shadow:var(--sombra)}
.confirma-caja > p{margin:0 0 18px;font-size:1rem}
.conf-tit{margin:0 0 12px;font-size:1.125rem;font-weight:700}
.conf-dest{display:flex;align-items:baseline;gap:8px;background:var(--primary-soft);color:var(--primary);border-radius:var(--r-m);padding:10px 14px;margin-bottom:12px;font-weight:600}
.conf-dest.alerta{background:var(--venc-soft);color:var(--venc-ink)}
.conf-num{font-size:2rem;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.conf-datos{margin:0 0 12px}
.conf-datos div{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.conf-datos div:last-child{border-bottom:0}
.conf-datos dt{color:var(--muted);font-size:.875rem;flex:none}
.conf-datos dd{margin:0;text-align:right;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.conf-datos dd s{color:var(--muted)}
.conf-aviso{margin:0 0 10px;padding:10px 12px;border-radius:var(--r-s);background:var(--pronto-soft);color:var(--pronto-ink);font-size:.875rem;font-weight:600}
.conf-aviso.fuerte{background:var(--venc-soft);color:var(--venc-ink)}
.confirma-caja .fila-btn{display:flex;gap:8px;justify-content:flex-end}
.btn-peligro{background:var(--venc);border-color:var(--venc);color:#fff}
.toast{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom));z-index:45;display:flex;justify-content:center;pointer-events:none}
.toast div{background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:var(--r-m);font-size:.9375rem;box-shadow:var(--sombra);max-width:520px;opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s}
.toast.on div{opacity:1;transform:none}
.toast.error div{background:var(--venc);color:#fff}

.login{position:fixed;inset:0;z-index:70;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px}
.login-caja{width:100%;max-width:340px;text-align:center}
.login-marca{font-weight:700;color:var(--primary);margin-bottom:4px}
.login h1{font-size:1.5rem;margin:0 0 20px}
.login input{width:100%;min-height:58px;text-align:center;font-size:1.75rem;letter-spacing:.35em;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);margin-bottom:12px;padding:0 12px}
.login input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.login-error{color:var(--venc);font-weight:600;min-height:1.4em;margin:12px 0 0}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary-soft);color:var(--primary);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.9375rem}
.esqueleto{height:74px;border-radius:var(--r-m);background:var(--surface);margin-bottom:6px;opacity:.6}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
@media (min-width:700px){
  .vista{max-width:680px;margin:0 auto}
  .top{max-width:704px;margin:0 auto;width:100%}
}
</style>
</head>
<body>
<div class="barra" id="barra"></div>
<div class="login" id="login" hidden>
  <div class="login-caja">
    <div class="login-marca">AccountStore</div>
    <h1>Ingresá tu PIN</h1>
    <form id="fLogin" autocomplete="off">
      <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" aria-label="PIN" autocomplete="current-password">
      <button class="btn btn-pri btn-bloque" type="submit">Entrar</button>
    </form>
    <p class="login-error" id="loginError" role="alert"></p>
  </div>
</div>
<div class="app">
  <header class="top">
    <div class="top-txt">
      <h1 id="titulo">Vencimientos</h1>
      <p id="subtitulo">Cargando la planilla…</p>
    </div>
    <button class="ic" id="btnUsuario" data-accion="sesion" aria-label="Sesión" hidden><span class="avatar" id="avatar"></span></button>
    <button class="ic" id="btnActualizar" data-accion="actualizar" aria-label="Actualizar datos de la planilla"></button>
  </header>

  <main>
    <section class="vista activa" id="v-venc" aria-labelledby="titulo">
      <div class="chips" id="chipsVenc" role="group" aria-label="Filtrar por vencimiento"></div>
      <ul class="lista" id="listaVenc"></ul>
    </section>

    <section class="vista" id="v-clientes">
      <div class="buscador">
        <div class="campo-busca"><span id="icoBusca"></span><input id="qClientes" type="search" placeholder="Nombre, teléfono, correo o servicio" autocomplete="off" aria-label="Buscar clientes"></div>
      </div>
      <div class="chips" id="chipsClientes" role="group" aria-label="Filtrar clientes"></div>
      <ul class="lista" id="listaClientes"></ul>
    </section>

    <section class="vista" id="v-cuentas">
      <div id="bannerAsignar"></div>
      <div class="chips" id="chipsServicios" role="group" aria-label="Elegir servicio"></div>
      <div id="cuentasCuerpo"></div>
    </section>

    <section class="vista" id="v-nuevo">
      <div id="nuevoCuerpo"></div>
    </section>
  </main>

  <nav class="tabs" role="tablist" aria-label="Secciones">
    <button class="tab" role="tab" data-accion="vista" data-v="venc" aria-selected="true"><span data-ico="cal"></span>Vencen</button>
    <button class="tab" role="tab" data-accion="vista" data-v="clientes" aria-selected="false"><span data-ico="gente"></span>Clientes</button>
    <button class="tab" role="tab" data-accion="vista" data-v="cuentas" aria-selected="false"><span data-ico="llave"></span>Cuentas</button>
    <button class="tab" role="tab" data-accion="vista" data-v="nuevo" aria-selected="false"><span data-ico="mas"></span>Nuevo</button>
  </nav>
</div>

<div class="hoja" id="hoja" hidden>
  <div class="hoja-fondo" data-accion="cerrar"></div>
  <div class="hoja-panel" id="hojaPanel" role="dialog" aria-modal="true"></div>
</div>
<div class="confirma" id="confirma" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"><div></div></div>

<script>
/* ================================================================
   Íconos
   ================================================================ */
const svg = (d, extra='') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${d}</svg>`;
const ICON = {
  cal: svg('<rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M12 13v3l2 1.5"/>'),
  gente: svg('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.8a3.3 3.3 0 0 1 0 6.4M18.2 14.8c1.8.8 2.9 2.5 3.3 5.2"/>'),
  llave: svg('<circle cx="8" cy="15" r="4.5"/><path d="M11.2 11.8 20 3M16.5 6.5l2.5 2.5M14 9l2 2"/>'),
  mas: svg('<circle cx="10" cy="8" r="3.5"/><path d="M3.5 20c.6-3.6 3.2-5.5 6.5-5.5 1.4 0 2.7.3 3.7 1M18.5 13v7M15 16.5h7"/>'),
  wa: svg('<path d="M20.5 11.6a8.4 8.4 0 0 1-12.4 7.4L3.5 20.5l1.5-4.4a8.4 8.4 0 1 1 15.5-4.5Z"/><path d="M9 8.6c.2 2.9 2.6 5.3 5.4 5.6l1-1.2-1.8-1-.9.8c-1-.4-1.8-1.2-2.2-2.2l.8-.9-1-1.8Z" fill="currentColor" stroke-width="1"/>'),
  renovar: svg('<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>'),
  copiar: svg('<rect x="8.5" y="8.5" width="12" height="12" rx="2"/><path d="M15.5 8.5V5.5a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/>'),
  ojo: svg('<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>'),
  cerrar: svg('<path d="M6 6l12 12M18 6 6 18"/>'),
  actualizar: svg('<path d="M20.5 12a8.5 8.5 0 0 1-14.9 5.6M3.5 12A8.5 8.5 0 0 1 18.4 6.4"/><path d="M18.5 2.5v4h-4M5.5 21.5v-4h4"/>'),
  buscar: svg('<circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5"/>'),
  ok: svg('<path d="m5 12.5 4.5 4.5L19 7.5"/>'),
  tel: svg('<path d="M5 3.5h3.5l1.8 4.5-2.3 1.4a11 11 0 0 0 6.6 6.6l1.4-2.3 4.5 1.8V19a1.5 1.5 0 0 1-1.6 1.5A16.5 16.5 0 0 1 3.5 5.1 1.5 1.5 0 0 1 5 3.5Z"/>')
};

/* ================================================================
   Estado y utilidades
   ================================================================ */
const S = {
  hoy: '', clientes: [], porRow: new Map(), porNombre: new Map(), servicios: [], leyenda: [], msgs: {},
  vista: 'venc', filtroVenc: null, filtroCli: 'activos', q: '', limCli: 50,
  hojaSel: null, cacheServ: {}, servViejo: {}, fCuentas: 'todas', qCuentas: '', limCuentas: 25,
  asignando: null, cargado: false, perfilAuto: true, token: '', usuario: '', permisos: {}, reglas: { sinDispositivo: [], conCorreo: [] }, bajasCargadas: false, serviciosCargados: false
};
const CAMPOS = ['row','nombre','id','perfil','fecha','monto','tel','correo','servicios','dispositivos','pin','pins','venc','dias','estado','meses'];

const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9@.]+/g, ' ').trim();
const soloNombre = s => String(s ?? '').replace(/[^\p{L}\p{N}\s.'-]/gu, '').replace(/\s+/g, ' ').trim();
const claveNombre = s => String(s ?? '').trim().toLowerCase();
const digitos = s => String(s ?? '').replace(/\D/g, '');
const miles = n => String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const gs = n => typeof n === 'number' ? (n < 0 ? '-' : '') + 'Gs. ' + miles(n) : String(n || '');
const pISO = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '') ? s.split('-').map(Number) : null;
const dmy = iso => { const p = pISO(iso); return p ? `${String(p[2]).padStart(2,'0')}/${String(p[1]).padStart(2,'0')}/${p[0]}` : (iso || ''); };
function sumarMeses(iso, n) {
  const [y, m, d] = pISO(iso);
  const base = new Date(Date.UTC(y, m - 1 + n, 1));
  const ult = new Date(Date.UTC(base.getUTCFullYear(), base.getUTCMonth() + 1, 0)).getUTCDate();
  base.setUTCDate(Math.min(d, ult));
  return base.toISOString().slice(0, 10);
}
function telNormal(s) {
  let d = digitos(s);
  if (!d) return '';
  if (d[0] === '0') d = '595' + d.slice(1);
  else if (d.length === 9 && d[0] === '9') d = '595' + d;
  return d;
}
const waLink = (tel, texto) => 'https://wa.me/' + telNormal(tel) + (texto ? '?text=' + encodeURIComponent(texto) : '');
const plural = (n, a, b) => n === 1 ? a : b;

function parseServicios(txt) {
  return String(txt || '').split(',').map(x => x.trim()).filter(x => x && x !== '-').map(s => {
    const m = s.match(/^(.*?)-(\d+)$/);
    return m ? { n: m[1].trim(), c: Math.max(1, Number(m[2])) } : { n: s, c: 1 };
  });
}
const textoServicios = items => items.map(i => i.c > 1 ? `${i.n}-${i.c}` : i.n).join(', ');
const totalPerfiles = items => items.reduce((a, i) => a + i.c, 0);

// Emoji del nombre: el del primer servicio según la leyenda de RegistrodeDatos
const RX_EMOJI_FIN = /[\p{Extended_Pictographic}\p{Emoji_Modifier}\uFE0F\u200D\u20E3]+$/u;
const claveServ = s => norm(String(s || '').split('-')[0]).replace(/ /g, '');
const sinEmojis = n => String(n || '').trim().replace(RX_EMOJI_FIN, '').trimEnd();
function emojiServicio(servicio) {
  const k = claveServ(servicio);
  if (!k) return '';
  let mejor = '', largo = 0;
  for (const [sv, em] of S.leyenda) {
    const kk = claveServ(sv);
    if (kk && (k === kk || k.startsWith(kk) || kk.startsWith(k)) && kk.length > largo) { mejor = em; largo = kk.length; }
  }
  return mejor;
}
// Base + emoji, repitiendo el emoji si ese nombre ya existe (Zulma🔵 → Zulma🔵🔵)
function nombreUnico(base, em, filaPropia = -1) {
  let n = base + em;
  for (let i = 0; i < 8; i++) {
    const otro = S.porNombre.get(claveNombre(n));
    if (!otro || otro.row === filaPropia) break;
    n += em;
  }
  return n;
}
function aplicarEmoji(f, elegido) {
  const base = sinEmojis(f.nombre.value);
  if (!base) return;
  const em = elegido || emojiServicio((parseServicios(f.servicios.value)[0] || {}).n);
  if (!em) return;
  const fila = f.dataset.row ? Number(f.dataset.row) : -1;
  f.nombre.value = nombreUnico(base, em, fila);
  f.dataset.finAuto = (f.nombre.value.match(RX_EMOJI_FIN) || [''])[0];
  revisarNombre(f, fila);
  revisarExistentes(f);
}
const emojiAuto = f => f && f.id === 'fNuevo' && f.dataset.auto !== '0';

function dec(a) {
  const c = {};
  CAMPOS.forEach((k, i) => c[k] = a[i]);
  c.busca = norm([c.nombre, c.tel, c.correo, c.servicios, c.id].join(' '));
  c.nomN = norm(soloNombre(c.nombre));
  return c;
}
function indexar() {
  S._catalogo = null;
  S.porRow = new Map(S.clientes.map(c => [c.row, c]));
  S.porNombre = new Map(S.clientes.map(c => [claveNombre(c.nombre), c]));
}
function tipo(c) {
  if (String(c.fecha).toUpperCase() === 'X' || c.estado === 'INACTIVO') return 'baja';
  if (typeof c.dias !== 'number') return 'sin';
  if (c.dias < 0) return 'vencido';
  if (c.dias === 0) return 'hoy';
  if (c.dias <= 3) return 'pronto';
  if (c.dias <= 7) return 'semana';
  return 'ok';
}
function tipoDias(d) {
  if (isNaN(d)) return 'sin';
  return d < 0 ? 'vencido' : d === 0 ? 'hoy' : d <= 3 ? 'pronto' : d <= 7 ? 'semana' : 'ok';
}
function badge(c) {
  const t = tipo(c);
  let num, lab;
  if (t === 'baja') { num = '–'; lab = 'baja'; }
  else if (t === 'sin') { num = '?'; lab = 'sin fecha'; }
  else if (c.dias === 0) { num = '0'; lab = 'hoy'; }
  else { num = String(c.dias); lab = Math.abs(c.dias) === 1 ? 'día' : 'días'; }
  return `<span class="dias t-${t}"><b>${num}</b><small>${lab}</small></span>`;
}
// En los dados de baja, Monto -3 = días que se le esperó
const esperoDias = c => tipo(c) === 'baja' && typeof c.monto === 'number' && c.monto < 0 && c.monto >= -60 ? -c.monto : 0;
function estadoTexto(c) {
  const t = tipo(c);
  if (t === 'baja') return 'Dado de baja';
  if (t === 'sin') return 'Sin fecha de activación';
  if (c.dias < 0) return `Venció hace ${-c.dias} ${plural(-c.dias, 'día', 'días')}, el ${dmy(c.venc)}`;
  if (c.dias === 0) return `Vence hoy, ${dmy(c.venc)}`;
  return `Vence en ${c.dias} ${plural(c.dias, 'día', 'días')}, el ${dmy(c.venc)}`;
}
function primerNombre(c) { return (soloNombre(c.nombre).split(' ')[0] || '').trim(); }
function llenar(tpl, c, venc) {
  return String(tpl || '')
    .replace(/\{nombre\}/g, primerNombre(c))
    .replace(/\{servicios\}/g, c.servicios || '')
    .replace(/\{vencimiento\}/g, dmy(venc || c.venc))
    .replace(/\{monto\}/g, gs(c.monto));
}
const msgRecordatorio = c => llenar(tipo(c) === 'vencido' ? S.msgs.vencido : S.msgs.porVencer, c);

/* ================================================================
   Servidor
   ================================================================ */
let pendientes = 0;
/*
 * Dirección de la API: el link /exec de tu implementación de Apps Script.
 * Solo se usa en la app instalada (GitHub Pages); dentro de Apps Script no hace falta.
 */
const API_URL = 'https://script.google.com/macros/s/AKfycbzDxrFjP9IHW4Xa-3o4onyOkU7e0o5h1RMyc-BSjddQSC_2eVeKhjD3NisHXEu3uTZf/exec';
const EN_APPS_SCRIPT = typeof google !== 'undefined' && !!(google.script && google.script.run);

function llamar(fn, args) {
  pendientes++; $('#barra').classList.add('on');
  const fin = () => { if (--pendientes <= 0) { pendientes = 0; $('#barra').classList.remove('on'); } };
  if (EN_APPS_SCRIPT) {
    return new Promise((ok, mal) => {
      google.script.run
        .withSuccessHandler(r => { fin(); ok(r); })
        .withFailureHandler(e => { fin(); mal(e); })[fn](...args);
    });
  }
  // App instalada: la misma llamada, por internet a la API
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // así no hace falta permiso extra (CORS)
    body: JSON.stringify({ fn, args })
  }).then(res => {
    if (!res.ok) throw new Error('La planilla no respondió (error ' + res.status + ').');
    return res.json();
  }).then(j => {
    if (!j.ok) throw new Error(j.error);
    return j.r;
  }, e => {
    throw e instanceof TypeError ? new Error('Sin conexión. Revisá internet e intentá de nuevo.') : e;
  }).finally(fin);
}
const msgError = e => (e && e.message ? e.message : String(e)).replace(/^Exception:\s*/, '').replace(/^CAMBIADO:\s*/, '');
// Lo que la app cree que tiene el cliente: el servidor verifica que siga igual antes de sumar
const esperado = c => ({ fecha: c.fecha, meses: c.meses });
// Permisos del usuario: si el servidor no dice nada, se asume que puede
const puede = accion => S.permisos[accion] !== false;
// Toda llamada lleva la sesión; si venció, vuelve a pedir el PIN
function api(fn, ...args) {
  return llamar(fn, [S.token, ...args]).catch(e => {
    if (/CAMBIADO:/.test(e && e.message)) { hoja.cerrar(); setTimeout(() => cargar(true, true), 300); }
    if (/(^|:\s*)SESION$/.test(msgError(e))) {
      sesionVencida();
      throw new Error('Tu sesión venció. Entrá de nuevo con tu PIN.');
    }
    throw e;
  });
}

/* ================================================================
   Sesión (PIN)
   ================================================================ */
const sesionGuardada = {
  get() { try { return localStorage.getItem('as_sesion') || ''; } catch (e) { return ''; } },
  set(v) { try { v ? localStorage.setItem('as_sesion', v) : localStorage.removeItem('as_sesion'); } catch (e) { } }
};
function mostrarLogin(mensaje = '') {
  hoja.cerrar();
  $('#confirma').hidden = true;
  $('#login').hidden = false;
  $('#loginError').textContent = mensaje;
  $('#pin').value = '';
  setTimeout(() => $('#pin').focus(), 50);
}
function sesionVencida() {
  S.token = ''; sesionGuardada.set('');
  mostrarLogin('Tu sesión venció. Ingresá tu PIN de nuevo.');
}
function mostrarUsuario() {
  $('#btnUsuario').hidden = !S.usuario;
  $('#avatar').textContent = (S.usuario || '?').trim().charAt(0).toUpperCase();
  $('#btnUsuario').setAttribute('aria-label', 'Sesión de ' + (S.usuario || ''));
}
async function entrarPIN(f) {
  const pin = f.pin.value.trim();
  if (!/^\d{6,8}$/.test(pin)) { $('#loginError').textContent = 'El PIN tiene de 6 a 8 números.'; return; }
  const b = f.querySelector('[type=submit]'); b.disabled = true; b.textContent = 'Entrando…';
  try {
    const r = await llamar('entrar', [pin]);
    S.token = r.token; S.usuario = r.usuario;
    sesionGuardada.set(r.token);
    $('#login').hidden = true;
    mostrarUsuario();
    if (S.cargado) toast('Hola ' + r.usuario); else cargar();
  } catch (e) {
    $('#loginError').textContent = msgError(e);
    f.pin.value = ''; f.pin.focus();
  } finally { b.disabled = false; b.textContent = 'Entrar'; }
}
async function cerrarSesion() {
  if (!await confirmar(`¿Cerrar la sesión de <b>${esc(S.usuario)}</b>? Para volver a entrar vas a necesitar el PIN.`, 'Cerrar sesión')) return;
  S.token = ''; S.usuario = ''; S.permisos = {}; sesionGuardada.set(''); datosLocales.borrar(); servLocales.borrar();
  S.clientes = []; S.cacheServ = {}; S.servViejo = {}; S.cargado = false; S.hojaSel = null; S.asignando = null;
  indexar();
  ['#listaVenc', '#listaClientes', '#cuentasCuerpo', '#nuevoCuerpo', '#chipsVenc', '#chipsClientes', '#chipsServicios'].forEach(x => $(x).innerHTML = '');
  mostrarUsuario();
  mostrarLogin();
}

/* ================================================================
   Avisos, confirmación y hoja inferior
   ================================================================ */
let toastT;
function toast(texto, error = false) {
  const t = $('#toast');
  t.firstElementChild.textContent = texto;
  t.classList.toggle('error', error);
  t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('on'), error ? 5000 : 2600);
}
function confirmar(texto, boton = 'Confirmar', peligro = false) {
  return confirmarHTML(`<p>${texto}</p>`, boton, peligro);
}
/* Resumen antes de guardar: destacado (los meses), filas [etiqueta, valor HTML] y avisos [texto, fuerte] */
function confirmarResumen(titulo, destacado, filas, avisos, boton) {
  const html = `<h3 class="conf-tit">${esc(titulo)}</h3>
    ${destacado ? `<div class="conf-dest ${/data-alerta/.test(destacado) ? 'alerta' : ''}">${destacado}</div>` : ''}
    <dl class="conf-datos">${filas.filter(Boolean).map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${v}</dd></div>`).join('')}</dl>
    ${avisos.filter(Boolean).map(([t, fuerte]) => `<p class="conf-aviso ${fuerte ? 'fuerte' : ''}">${t}</p>`).join('')}`;
  return confirmarHTML(html, boton, false);
}

function puntaje(c, q, qd) {
  if (c.nomN.startsWith(q)) return 0;
  if (c.nomN.includes(' ' + q)) return 1;
  if (c.nomN.includes(q)) return 2;
  if (qd.length >= 3 && c.tel.includes(qd)) return 3;
  if (c.busca.includes(q)) return 4;
  return -1;
}
function buscarClientes(texto, filtro = 'todos') {
  const q = norm(texto), qd = digitos(texto);
  let base = S.clientes;
  if (filtro === 'activos') base = base.filter(c => tipo(c) !== 'baja');
  if (filtro === 'bajas') base = base.filter(c => tipo(c) === 'baja');
  if (!q) return base.slice().sort((a, b) => a.nomN.localeCompare(b.nomN));
  const out = [];
  for (const c of base) { const p = puntaje(c, q, qd); if (p >= 0) out.push([p, c]); }
  out.sort((a, b) => a[0] - b[0] || (tipo(a[1]) === 'baja') - (tipo(b[1]) === 'baja') || a[1].nomN.localeCompare(b[1].nomN));
  return out.map(x => x[1]);
}
function renderClientes() {
  const n = { activos: 0, bajas: 0 };
  S.clientes.forEach(c => tipo(c) === 'baja' ? n.bajas++ : n.activos++);

  $('#chipsClientes').innerHTML = [['activos', 'Activos', n.activos], ['todos', 'Todos', S.bajasCargadas ? S.clientes.length : pend], ['bajas', 'Dados de baja', S.bajasCargadas ? n.bajas : pend]]

  $('#listaClientes').innerHTML = res.length

      (res.length > S.limCli ? `<li><button class="btn mas" data-accion="mas-cli">Mostrar ${Math.min(50, res.length - S.limCli)} más de ${res.length - S.limCli}</button></li>` : '')

  if (!S.bajasCargadas && S.filtroCli !== 'activos') $('#listaClientes').insertAdjacentHTML('beforeend', '<li class="vacio">Todavía se están cargando los dados de baja…</li>');
  if (S.vista === 'clientes') $('#subtitulo').textContent = S.q ? `${res.length} ${plural(res.length, 'resultado', 'resultados')}` : `${S.clientes.length} en la base`;
}

/* ================================================================
   Formulario de cliente (nuevo y editar)
   ================================================================ */
function topValores(campo, n, partir = false) {
  const cnt = new Map();
  for (const c of S.clientes) {
    const vals = partir ? String(c[campo] || '').split(',') : [c[campo]];
    for (let v of vals) { v = String(v || '').trim(); if (v && v !== '-' && v.toUpperCase() !== 'X') cnt.set(v, (cnt.get(v) || 0) + 1); }
  }
  return [...cnt.entries()].sort((a, b) => b[1] - a[1]).slice(0, n).map(x => x[0]);
}
const AYUDA_NOMBRE = 'El nombre tiene que ser único: las hojas de servicio lo buscan tal cual.';
const AYUDA_NOMBRE_NUEVO = 'El emoji se pone solo según el primer servicio. Tocá otro para cambiarlo.';
// modo: 'nuevo' | 'editar' | 'reactivar'
/**
 * Todos los servicios: los de la leyenda de RegistrodeDatos (con su emoji) más
 * los que aparecen en la base sin estar en la leyenda. Cada uno trae sus variantes
 * de uso real (Netflix, Netflix-Premium, Netflix-Privado...), escritas como las usás más.
 */
function catalogoServicios() {
  if (S._catalogo) return S._catalogo;
  const formas = new Map();   // variante normalizada -> {textos, total, activos}
  for (const c of S.clientes) {
    const activo = tipo(c) !== 'baja';
    for (const it of parseServicios(c.servicios)) {
      const kv = norm(it.n).replace(/ /g, '');
      if (!kv) continue;
      let f = formas.get(kv);
      if (!f) formas.set(kv, f = { textos: new Map(), total: 0, activos: 0 });
      f.textos.set(it.n, (f.textos.get(it.n) || 0) + 1);
      f.total++; if (activo) f.activos++;
    }
  }
  const grupoDe = texto => {
    const k = claveServ(texto); let mejor = null;
    S.leyenda.forEach(([sv], i) => {
      const kk = claveServ(sv);
      if (kk && (k === kk || k.startsWith(kk) || kk.startsWith(k)) && (!mejor || kk.length > mejor.len)) mejor = { i, len: kk.length };
    });
    return mejor ? 'L' + mejor.i : 'X' + k;
  };
  const grupos = new Map();
  S.leyenda.forEach(([sv, em], i) => grupos.set('L' + i, { nombre: sv.trim(), emoji: em, vars: [], uso: 0, total: 0 }));
  for (const f of formas.values()) {
    const texto = [...f.textos.entries()].sort((a, b) => b[1] - a[1])[0][0];
    const g = grupoDe(texto);
    if (!grupos.has(g)) grupos.set(g, { nombre: texto.split('-')[0].trim(), emoji: '', vars: [], uso: 0, total: 0 });
    const gr = grupos.get(g);
    gr.vars.push({ texto, total: f.total, activos: f.activos });
    gr.uso += f.activos; gr.total += f.total;
  }
  const lista = [];
  for (const [id, g] of grupos) {
    if (id[0] === 'X' && g.total < 2) continue;              // descarta errores sueltos de tipeo
    g.vars.sort((a, b) => b.activos - a.activos || b.total - a.total);
    let vars = g.vars.filter(v => v.activos >= 3 || v.total >= 20).map(v => v.texto);
    if (!vars.length) vars = [g.vars.length ? g.vars[0].texto : g.nombre];
    lista.push({ nombre: g.nombre, emoji: g.emoji, vars, uso: g.uso, total: g.total });
  }
  lista.sort((a, b) => b.uso - a.uso || b.total - a.total || a.nombre.localeCompare(b.nombre));
  return (S._catalogo = lista);
}

function camposCliente(c = {}, modo = 'editar') {
  const nuevo = modo === 'nuevo', react = modo === 'reactivar';

/* Reglas de Dispositivos y Correo según los servicios (se editan en CONFIG de Code.gs) */
const claveRegla = s => norm(String(s || '').replace(/-\d+$/, '')).replace(/ /g, '');
const aplicaRegla = (lista, sv) => { const k = claveRegla(sv); return (lista || []).some(r => k.startsWith(claveRegla(r))); };
function reglasServicios(txt) {
  const it = parseServicios(txt).map(i => i.n);
  return {
    hay: it.length > 0,
    sinDisp: it.length > 0 && it.every(n => aplicaRegla(S.reglas.sinDispositivo, n)),
    conCorreo: [...new Set(it.filter(n => aplicaRegla(S.reglas.conCorreo, n)))]
  };
}
const conReglas = f => f && (f.id === 'fNuevo' || f.id === 'fReactivar');
function aplicarReglas(f) {
  if (!conReglas(f)) return;
  const r = reglasServicios(f.servicios.value), disp = f.dispositivos;
  if (r.sinDisp) {
    if (!disp.readOnly) f.dataset.dispAntes = disp.value === '-' ? '' : disp.value;
    disp.value = '-'; disp.readOnly = true;
    f.querySelector('#cDispAyuda').textContent = 'Estos servicios no llevan dispositivo, queda "-".';
  } else {
    if (disp.readOnly) { disp.readOnly = false; disp.value = f.dataset.dispAntes || ''; }
    f.querySelector('#cDispAyuda').textContent = r.hay ? 'Obligatorio para estos servicios.' : '';
  }
  f.querySelector('#cCorreoAyuda').textContent = r.conCorreo.length ? 'Obligatorio para ' + r.conCorreo.join(', ') + '.' : '';
}

function validarForm(f) {

  f.querySelectorAll('.campo.falta').forEach(x => x.classList.remove('falta'));
  const marcar = (campo, nombre) => { falta.push(nombre); const el = f[campo] && f[campo].closest('.campo'); if (el) el.classList.add('falta'); };
  if (!d.nombre) marcar('nombre', 'nombre');
  if (digitos(d.telefono).length < 8) marcar('telefono', 'teléfono');
  if (!r.hay) marcar('servicios', 'servicios');
  if (!d.id) marcar('idc', 'ID');
  if (!pISO(d.fecha)) marcar('fecha', 'activación');
  if (!(Number(d.meses) >= 1)) marcar('meses', 'meses');
  if (!(Number(d.monto) > 0)) marcar('monto', 'monto');
  if (r.hay && !r.sinDisp && (!d.dispositivos || d.dispositivos === '-')) marcar('dispositivos', 'dispositivos');
  if (r.conCorreo.length && !/^\S+@\S+\.\S+$/.test(d.correo)) marcar('correo', 'correo');

}

function agregarServicio(f, texto) {
  const items = parseServicios(f.servicios.value);

function cambiarServicio(f, k, delta) {

// Mientras cargás un cliente nuevo: ¿ya existe por teléfono o por nombre?
function revisarExistentes(f) {
  const box = f && f.querySelector('#cExiste'); if (!box) return;
  const t9 = telNormal(f.telefono.value).slice(-9);
  if (f.dataset.copiadoDe) {
    const c0 = S.porRow.get(Number(f.dataset.copiadoDe));
    if (c0 && telNormal(c0.tel).slice(-9) === t9) {
      box.innerHTML = `<div class="existe"><p style="margin:0">Datos copiados de <b>${esc(c0.nombre)}</b>. <button type="button" class="link" style="padding:4px 0" data-accion="ver-coincidencias">Ver coincidencias</button></p></div>`;
      return;
    }
    delete f.dataset.copiadoDe;
  }
  const q = norm(soloNombre(f.nombre.value));
  const res = [], vistos = new Set();
  const sumar = (c, por) => { if (!vistos.has(c.row)) { vistos.add(c.row); res.push([c, por]); } };
  // 1) mismo teléfono (el dato más seguro)
  if (t9.length >= 8) S.clientes.forEach(c => { if (telNormal(c.tel).slice(-9) === t9) sumar(c, 'tel'); });
  // 2) por nombre mientras escribís: exacto, empieza igual, o alguna palabra empieza igual
  let masNombres = 0;
  if (q.length >= 3) {
    const cand = [];
    S.clientes.forEach(c => {
      if (vistos.has(c.row)) return;
      const p = c.nomN === q ? 0 : c.nomN.startsWith(q) ? 1 : c.nomN.includes(' ' + q) ? 2 : -1;
      if (p >= 0) cand.push([p, c]);
    });
    cand.sort((x, y) => x[0] - y[0] || x[1].nomN.localeCompare(y[1].nomN));
    const cupo = Math.max(0, 5 - res.length);
    cand.slice(0, cupo).forEach(([, c]) => sumar(c, 'nombre'));
    masNombres = Math.max(0, cand.length - cupo);
  }
  const buscando = !S.bajasCargadas && (t9.length >= 8 || q.length >= 3);
  if (!res.length) { box.innerHTML = buscando ? '<span class="ayuda">Buscando también entre los dados de baja…</span>' : ''; return; }
  const soloTel = res.every(([, por]) => por === 'tel');
  const titulo = soloTel ? (res.length === 1 ? 'Este número ya está en la base' : `Este número ya está en ${res.length} filas`) : '¿Es alguno de estos?';
  box.innerHTML = `<div class="existe"><p><b>${titulo}</b>${buscando ? ' (faltan los dados de baja)' : ''}<br><span class="ex-ayuda">Tocá un nombre para copiar sus datos.</span></p><ul>` +
    res.map(([c, por]) => {
      const baja = tipo(c) === 'baja';
      const extra = !soloTel && por === 'tel' ? ', mismo teléfono' : '';
      return `<li><button type="button" class="ex-usar" data-accion="usar-datos" data-row="${c.row}" aria-label="Copiar los datos de ${esc(c.nombre)}">${badge(c)}<span class="ex-txt"><b>${esc(c.nombre)}</b><small>${esc((c.servicios || 'sin servicios') + extra)}</small></span></button>
        <button type="button" class="btn btn-sm ${baja ? 'btn-pri' : ''}" data-accion="${baja ? 'reactivar' : 'detalle'}" data-row="${c.row}" data-origen="nuevo">${baja ? 'Reactivar' : 'Ver'}</button></li>`;
    }).join('') + '</ul>' +
    (masNombres ? `<p style="margin:8px 2px 0">Y ${masNombres} ${plural(masNombres, 'más', 'más')} con ese nombre. Seguí escribiendo el apellido para achicar la lista.</p>` : '') + '</div>';
}

// Qué cambia entre el cliente guardado y el formulario
function cambiosCliente(c, d) {
  const limpio = v => { v = String(v == null ? '' : v).trim(); return v === '-' ? '' : v; };
  const campos = [
    ['Nombre', c.nombre, d.nombre],
    ['Teléfono', telNormal(c.tel), d.telefono],
    ['Servicios', c.servicios, d.servicios],
    ['ID', c.id, d.id],
    ['Dispositivos', c.dispositivos, d.dispositivos],
    ['PIN', c.pin, d.pin],
    ['PINS', c.pins, d.pins],
    ['Correo', c.correo, d.correo],
    ['Monto', typeof c.monto === 'number' ? String(c.monto) : limpio(c.monto), d.monto === undefined ? (typeof c.monto === 'number' ? String(c.monto) : limpio(c.monto)) : d.monto]
  ];
  const out = [];
  for (const [k, a, b] of campos) {
    if (limpio(a) === limpio(b)) continue;
    const fmt = v => k === 'Monto' && limpio(v) ? gs(Number(v)) : esc(limpio(v));
    out.push([k, cambio(fmt(a), fmt(b))]);
  }
  return out;
}

  const filas = cambiosCliente(c, d);
  const mesesAntes = typeof c.meses === 'number' ? c.meses : Number(c.meses) || 0, mesesDespues = Number(d.meses) || 0;
  const bajaAntes = tipo(c) === 'baja', bajaDespues = d.fecha === 'X';
  const venceAntes = bajaAntes ? 'dado de baja' : dmy(c.venc);
  const venceDespues = bajaDespues ? 'dado de baja' : dmy(sumarMeses(d.fecha, mesesDespues));
  const avisos = [];
  if (mesesAntes !== mesesDespues) filas.push(['Meses', cambio(String(mesesAntes), String(mesesDespues))]);
  if (!bajaDespues && d.fecha !== c.fecha) filas.push(['Activación', cambio(pISO(c.fecha) ? dmy(c.fecha) : 'sin fecha', dmy(d.fecha))]);
  if (venceAntes !== venceDespues) filas.push(['Vencimiento', cambio(venceAntes, venceDespues)]);
  if (!filas.length) return toast('No cambiaste nada.');
  const dif = mesesDespues - mesesAntes;
  if (!bajaDespues && Math.abs(dif) > 3) avisos.push([`Ojo: los meses ${dif > 0 ? 'suben' : 'bajan'} ${Math.abs(dif)} de golpe. Para cobrar un mes nuevo usá Renovar.`, true]);
  if (!bajaDespues && pISO(d.fecha) && sumarMeses(d.fecha, mesesDespues) < S.hoy && !bajaAntes) avisos.push(['Con estos datos queda vencido.', true]);
  if (bajaDespues && !bajaAntes) avisos.push(['Queda dado de baja (X en la fecha).', true]);
  if (d.nombre !== c.nombre) avisos.push(['El nombre nuevo también se cambia en las hojas de servicio.', false]);
  const ok = await confirmarResumen('¿Guardar estos cambios?', '', [['Cliente', `<b>${esc(c.nombre)}</b>`], ...filas], avisos, 'Guardar cambios');
  if (!ok) return;
  const b = f.querySelector('[type=submit]'); b.disabled = true; b.textContent = 'Guardando…';
  try {
    const r = await api('guardarCliente', c.row, c.nombre, d, esperado(c));
    const nuevo = actualizarCliente(r.cliente);
    toast(r.renombrados ? `Cambios guardados. Nombre actualizado en ${r.renombrados} ${plural(r.renombrados, 'lugar', 'lugares')}.` : 'Cambios guardados');
    abrirDetalle(nuevo.row, true);
  } catch (e) { toast(msgError(e), true); b.disabled = false; b.textContent = 'Guardar cambios'; }
}

function adivinarHoja(servicios) {
  const k = s => norm(s).replace(/ /g, '');

  for (const p of partes) {
    const h = S.servicios.find(n => { const kn = k(n); return kn && (kn === p || p.startsWith(kn) || kn.startsWith(p)); });
    if (h) return h;
  }
  return null;
}
const cicloTxt = s => { s = String(s || '').trim().toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); };

function renderListaCuentas() {
  const data = S.cacheServ[S.hojaSel];
  if (!data || !$('#listaCuentas')) return;
  const q = norm(S.qCuentas);
  // Las cuentas "reactivar" no están activas: no suman lugares libres y van aparte
  const libresDe = c => c.inactiva ? 0 : c.slots.filter(s => s.libre).length;
  const activas = data.cuentas.filter(c => !c.inactiva), nInact = data.cuentas.length - activas.length;

  else if (!q) lista = lista.filter(([c]) => !c.inactiva);   // buscando, también muestra las inactivas
  if (S.fCuentas === 'libres') lista = lista.filter(([c]) => libresDe(c) > 0);
  if (S.fCuentas === 'llenas') lista = lista.filter(([c]) => !c.inactiva && c.slots.length && libresDe(c) === 0);
  if (q) lista = lista.filter(([c]) => norm([c.nombre, c.plan, c.correo, ...c.slots.map(s => s.usuario || '')].join(' ')).includes(q));

    : `${activas.length} ${plural(activas.length, 'cuenta activa', 'cuentas activas')}, ${totLibres} ${plural(totLibres, 'lugar libre', 'lugares libres')}${nInact ? `, ${nInact} para reactivar` : ''}${mostrando}`;

function tarjetaCuenta(c, i) {

  if (c.ciclo && !c.inactiva) pills.push(`<span class="pill">${esc(cicloTxt(c.ciclo))}</span>`);

/* Copia local de las últimas hojas abiertas: Cuentas abre al instante y se actualiza por detrás */
const CLAVE_SERV = 'as_serv_v1';
const servLocales = {
  todo() { try { return JSON.parse(localStorage.getItem(CLAVE_SERV) || '{}'); } catch (e) { return {}; } },
  leer(h) { return this.todo()[h] || null; },
  guardar(h, data) {
    try {
      const t = this.todo();
      t[h] = { ts: Date.now(), data };
      const orden = () => Object.keys(t).sort((a, b) => t[b].ts - t[a].ts);
      orden().slice(6).forEach(k => delete t[k]);                 // las 6 más recientes
      let txt = JSON.stringify(t);
      while (txt.length > 2500000 && Object.keys(t).length > 1) { delete t[orden().pop()]; txt = JSON.stringify(t); }
      localStorage.setItem(CLAVE_SERV, txt);
    } catch (e) { }
  },
  borrar() { try { localStorage.removeItem(CLAVE_SERV); } catch (e) { } }
};
// El servidor a veces devuelve solo la cuenta que cambió: se reemplaza esa y queda el resto
function mezclarServicio(hoja, data) {
  if (!data) return data;
  if (!data.parcial) { S.cacheServ[hoja] = data; delete S.servViejo[hoja]; servLocales.guardar(hoja, data); return data; }
  const actual = S.cacheServ[hoja];
  if (!actual) return data;
  for (const c of data.cuentas) {
    const i = actual.cuentas.findIndex(x => x.header === c.header);
    if (i >= 0) actual.cuentas[i] = c; else { delete S.cacheServ[hoja]; return data; }
  }
  if (!S.servViejo[hoja]) servLocales.guardar(hoja, actual);
  return data;
}

const enVuelo = {};
async function cargarHoja(h, forzar = false) {
  if (forzar) { delete S.cacheServ[h]; delete S.servViejo[h]; if (S.hojaSel === h) { renderCuentas(); return enVuelo[h]; } }
  if (S.hojaSel !== h) { S.hojaSel = h; renderCuentas(); return enVuelo[h] || S.cacheServ[h]; }
  if (S.cacheServ[h] && !S.servViejo[h]) return S.cacheServ[h];
  if (enVuelo[h]) return enVuelo[h];
  if (!S.cacheServ[h] && !forzar) {
    const loc = servLocales.leer(h);
    if (loc) { S.cacheServ[h] = loc.data; S.servViejo[h] = loc.ts; }
  }
  enVuelo[h] = api('getServicio', h).then(data => {
    S.cacheServ[h] = data; delete S.servViejo[h];
    servLocales.guardar(h, data);
    if (S.hojaSel === h) $('#listaCuentas') ? renderListaCuentas() : renderCuentas();
    return data;
  }).catch(e => {
    toast(msgError(e), true);
    if (S.hojaSel === h && !S.cacheServ[h]) $('#cuentasCuerpo').innerHTML = `<div class="vacio"><strong>No se pudo abrir ${esc(h)}</strong>${esc(msgError(e))}</div>`;
    return S.cacheServ[h] || null;
  }).finally(() => { delete enVuelo[h]; });
  if (S.servViejo[h] && S.hojaSel === h) renderCuentas();   // mostrar ya la copia guardada
  return enVuelo[h];
}

async function guardarPass(f) {

async function irALugar(h, fila) {

function cambiarVista(v) {
  S.vista = v;
  document.querySelectorAll('.vista').forEach(el => el.classList.toggle('activa', el.id === 'v-' + v));

document.addEventListener('click', e => {

    case 'mas-cli': S.limCli += 50; renderClientes(); break;

    case 'reactivar': abrirReactivar(d.row, d.origen); break;

    case 'pend-liberar-hoja': { const h = S.pend[Number(d.h)]; const lista = []; h.cuentas.forEach(c => c.slots.forEach(p => { if (!p.libre && (p.baja || p.noEsta)) lista.push({ p, c }); })); liberarPend(Number(d.h), lista); break; }
    case 'ubicar': ubicar(d.row); break;

    case 'cancelar-asignar': S.asignando = null; S.fCuentas = 'todas'; renderCuentas(); break;
    case 'copiar-txt': copiar(d.t); break;
    case 'hoja': S.fCuentas = S.asignando ? 'libres' : 'todas'; S.qCuentas = ''; S.limCuentas = 25; S.hojaSel === d.h ? renderCuentas() : cargarHoja(d.h); break;
    case 'f-cuentas': S.fCuentas = d.f; S.limCuentas = 25; renderListaCuentas(); break;
    case 'mas-cuentas': S.limCuentas += 25; renderListaCuentas(); break;

    case 'ver-pass': { const sp = el.querySelector('[data-pass]'); const c = cuentaSel(d.i); sp.textContent = sp.textContent === c.pass ? '••••••••' : c.pass; break; }
    case 'lugar': abrirLugar(d.i, d.j); break;

  const esCli = f && ['fNuevo', 'fEditar', 'fReactivar'].includes(f.id);
  if (esCli && (t.name === 'fecha' || t.name === 'meses')) previaForm(f);
  if (esCli && t.name === 'servicios') renderServicios(f);
  if (esCli && t.name === 'nombre') revisarNombre(f, f.dataset.row ? Number(f.dataset.row) : -1);
  if (f && f.id === 'fEditar' && t.name === 'baja') f.fecha.disabled = t.checked;
});
document.addEventListener('change', e => {
  const t = e.target, f = t.form;
  if (f && f.id === 'fEditar' && t.name === 'baja') { f.fecha.disabled = t.checked; if (!t.checked && !f.fecha.value) f.fecha.value = S.hoy; }
  if (f && f.id === 'fRenovar') previaRenovar();
  if (emojiAuto(f) && (t.name === 'nombre' || t.name === 'servicios')) aplicarEmoji(f);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && hoja.abierta) hoja.cerrar(); });

/* ================================================================
   Carga
   ================================================================ */
/*
 * Copia local de los datos: la app abre al instante con lo último que vio y se
 * actualiza por detrás. Se borra al cerrar sesión.
 */
const CLAVE_DATOS = 'as_datos_v1';
const datosLocales = {
  leer() { try { return JSON.parse(localStorage.getItem(CLAVE_DATOS) || 'null'); } catch (e) { return null; } },
  guardar(parte) { try { localStorage.setItem(CLAVE_DATOS, JSON.stringify(Object.assign(this.leer() || {}, parte))); } catch (e) { } },
  borrar() { try { localStorage.removeItem(CLAVE_DATOS); } catch (e) { } }
};
const hoyDispositivo = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
function horaDe(ts) {
  const d = new Date(ts), hh = d.toTimeString().slice(0, 5);
  return d.toDateString() === new Date().toDateString() ? 'de hoy ' + hh : 'del ' + d.toLocaleDateString('es-PY') + ' ' + hh;
}
function aplicarInicial(d, desfase = 0) {
  S.hoy = desfase ? hoyDispositivo() : d.hoy; S.leyenda = d.leyenda; S.msgs = d.msgs;
  S.usuario = d.usuario || S.usuario; S.permisos = d.permisos || {}; S.reglas = d.reglas || S.reglas; mostrarUsuario();
  S.perfilAuto = d.perfilAuto !== false;
  S.clientes = d.clientes.map(dec);
  if (desfase) S.clientes.forEach(c => { if (typeof c.dias === 'number') c.dias -= desfase; });
  S.bajasCargadas = false;
  indexar();
  S.cargado = true;
}
function sumarBajas(lista) {
  const nuevos = lista.map(dec).filter(c => !S.porRow.has(c.row));
  S.clientes = S.clientes.concat(nuevos);
  S.bajasCargadas = true;
  indexar();
  if (S.vista === 'clientes') renderClientes();
  const fn = $('#fNuevo');
  if (emojiAuto(fn) && fn.dataset.finAuto) aplicarEmoji(fn); else revisarExistentes(fn);
}

async function cargar(forzar = false, silencioso = false) {
  let lento, local = null;
  try {
    if (!S.cargado) {
      local = datosLocales.leer();
      if (local && local.inicial) {
        // Mostrar ya lo último guardado, corrigiendo los días si pasó la medianoche
        const [a1, m1, d1] = local.inicial.hoy.split('-').map(Number), [a2, m2, d2] = hoyDispositivo().split('-').map(Number);
        const desfase = Math.round((Date.UTC(a2, m2 - 1, d2) - Date.UTC(a1, m1 - 1, d1)) / 864e5);
        aplicarInicial(local.inicial, desfase);
        if (local.bajas) sumarBajas(local.bajas);
        if (local.servicios) { S.servicios = local.servicios; S.serviciosCargados = true; }
        cambiarVista(S.vista);
        $('#subtitulo').textContent = `Datos ${horaDe(local.ts)}, actualizando…`;
      } else {
        $('#listaVenc').innerHTML = '<div class="esqueleto"></div>'.repeat(6);
        lento = setTimeout(() => { if (!S.cargado) $('#subtitulo').textContent = 'La planilla está tardando en responder…'; }, 12000);
      }
    }
    const d = await api('getInicial');
    const bajasPrevias = local && local.bajas;
    aplicarInicial(d);
    datosLocales.guardar({ inicial: d, ts: Date.now() });
    if (bajasPrevias) S.bajasCargadas = false;
    if (forzar) { S.cacheServ = {}; S.servViejo = {}; }
    cambiarVista(S.vista);
    if (forzar && !silencioso) toast('Datos actualizados');

    // En segundo plano: la lista de hojas de servicio y los dados de baja
    api('getServiciosLista', forzar).then(lista => {
      S.servicios = lista; S.serviciosCargados = true;
      datosLocales.guardar({ servicios: lista });
      if (S.vista === 'cuentas') {
        if (S.asignando && !S.hojaSel) { const h = adivinarHoja(S.asignando.servicios); if (h) return cargarHoja(h); }
        forzar && S.hojaSel ? cargarHoja(S.hojaSel, true) : renderCuentas();
      }
    }).catch(e => toast(msgError(e), true));
    api('getBajas').then(lista => {
      datosLocales.guardar({ bajas: lista });
      sumarBajas(lista);
    }).catch(e => toast('No se pudieron cargar los dados de baja: ' + msgError(e), true));
  } catch (e) {
    if (!S.token) return;   // se venció la sesión: ya se muestra la pantalla de PIN
    if (S.cargado && local && local.inicial) {
      $('#subtitulo').textContent = `Sin conexión: datos ${horaDe(local.ts)}`;
      toast(msgError(e), true);
      return;
    }
    $('#subtitulo').textContent = 'No se pudo leer la planilla';
    $('#listaVenc').innerHTML = `<li class="vacio"><strong>No se pudo leer la planilla</strong>${esc(msgError(e))}<br><button class="btn mas" data-accion="actualizar">Reintentar</button></li>`;
  } finally { clearTimeout(lento); }
}

document.querySelectorAll('[data-ico]').forEach(el => el.outerHTML = ICON[el.dataset.ico]);
const medirTop = () => document.documentElement.style.setProperty('--top-h', $('.top').offsetHeight + 'px');
medirTop(); addEventListener('resize', medirTop);
$('#btnActualizar').innerHTML = ICON.actualizar;
$('#icoBusca').outerHTML = ICON.buscar;
S.token = sesionGuardada.get();
if (S.token) cargar(); else mostrarLogin();
if (!EN_APPS_SCRIPT && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => { });
}
</script>
