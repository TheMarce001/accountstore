async function guardarEditar(f) {
  const c = S.porRow.get(Number(f.dataset.row));
  if (!revisarNombre(f, c.row)) return toast('Ese nombre ya existe.', true);
  const d = datosForm(f);
  if (!d.nombre) return toast('El nombre no puede quedar vacío.', true);
  if (d.fecha !== 'X' && !pISO(d.fecha)) return toast('Poné la fecha de activación.', true);
  if (!d.monto) delete d.monto;
  const filas = cambiosCliente(c, d);
  const mesesAntes = typeof c.meses === 'number' ? c.meses : Number(c.meses) || 0, mesesDespues = Number(d.meses) || 0;
  const bajaAntes = tipo(c) === 'baja', bajaDespues = d.fecha === 'X';
  const venceAntes = bajaAntes ? 'dado de baja' : dmy(c.venc);
  const venceDespues = bajaDespues ? 'dado de baja' : dmy(sumarMeses(d.fecha, mesesDespues));
  const avisos = [];
  if (mesesAntes !== mesesDespues) filas.push(['Meses', cambio(String(mesesAntes), String(mesesDespues))]);
  if (!bajaDespues && d.fecha !== c.fecha) filas.push(['Activación', cambio(pISO(c.fecha) ? dmy(c.fecha) : 'sin fecha', dmy(d.fecha))]);
  if (venceAntes !== venceDespues) filas.push(['Vencimiento', cambio(venceAntes, venceDespues)]);
  if (!filas.length) return toast('No cambiaste nada.');
  const dif = mesesDespues - mesesAntes;
  if (!bajaDespues && Math.abs(dif) > 3) avisos.push([`Ojo: los meses ${dif > 0 ? 'suben' : 'bajan'} ${Math.abs(dif)} de golpe. Para cobrar un mes nuevo usá Renovar.`, true]);
  if (!bajaDespues && pISO(d.fecha) && sumarMeses(d.fecha, mesesDespues) < S.hoy && !bajaAntes) avisos.push(['Con estos datos queda vencido.', true]);
  if (bajaDespues && !bajaAntes) avisos.push(['Queda dado de baja (X en la fecha).', true]);
  if (d.nombre !== c.nombre) avisos.push(['El nombre nuevo también se cambia en las hojas de servicio.', false]);
  const rp = reglasServicios(d.servicios);
  if (rp.conPass.length && !d.password) avisos.push([`Falta la contraseña de ${esc(rp.conPass.join(', '))}.`, true]);
  const ok = await confirmarResumen('¿Guardar estos cambios?', '', [['Cliente', `<b>${esc(c.nombre)}</b>`], ...filas], avisos, 'Guardar cambios');
  if (!ok) return;
  const b = f.querySelector('[type=submit]'); b.disabled = true; b.textContent = 'Guardando…';
  try {
    const r = await guardarClienteSeguro(c, d, b);
    const nuevo = actualizarCliente(r.cliente);
    toast(r.renombrados ? `Cambios guardados. Nombre actualizado en ${r.renombrados} ${plural(r.renombrados, 'lugar', 'lugares')}.` : 'Cambios guardados');
    abrirDetalle(nuevo.row, true);
  } catch (e) { toast(msgError(e), true); b.disabled = false; b.textContent = 'Guardar cambios'; }
}

function ayudaDias(f) {

async function guardarBaja(f) {

  const lugares = S._bajaLugares || [];

    ['Servicios', serviciosTxt(c.servicios)],
    ['Vencimiento', cambio(pISO(c.venc) ? dmy(c.venc) : 'sin fecha', 'dado de baja')],
    dias > 0 && ['Monto', cambio(typeof c.monto === 'number' ? gs(c.monto) : '', moraDe(c.servicios) ? `-${miles(moraDe(c.servicios))} (mora; esperó ${dias} ${plural(dias, 'día', 'días')})` : `-${dias} (esperó ${dias} ${plural(dias, 'día', 'días')})`)],
    marcas.length && ['Marcar "cerrar"', marcas.map(nombreLugar).join('<br>')]
  ], [

  ], 'Dar de baja');
  if (!ok) return;
  const b = f.querySelector('[type=submit]'); b.disabled = true; b.textContent = 'Guardando…';

    const r = await api('darDeBaja', c.row, c.nombre, dias, marcas.map(u => ({ hoja: u.hoja, row: u.row })));
    S.resumenViejo = true;
    actualizarOcupacionFondo(lugares.map(u => u.hoja));   // su lugar pasa a contar como disponible
    const nuevo = actualizarCliente(r.cliente);
    const filas = r.marcas.map(m => `<li class="pend-fila"><span><b>${esc(m.hoja)}, ${esc(m.cuenta || 'fila ' + m.row)}</b>
        <small>${m.ok ? 'marcado "cerrar"' : 'no se marcó: ' + esc(m.motivo || '')}</small>

      <div class="pila"><button class="btn" data-accion="cerrar">Listo</button></div>`);

      mezclarServicio(m.hoja, cu);
      const nc = cu && cu.cuentas && cu.cuentas.find(x => x.slots.some(y => y.row === Number(m.row)));
      const el = document.querySelector(`[data-ult="${CSS.escape(m.hoja + '|' + m.row)}"]`);
      if (el) el.innerHTML = textoUltCambio(nc ? nc.ultimoCambio || '' : null);

// Último cambio de contraseña de la cuenta que tiene ese lugar: de la hoja ya cargada (null = todavía no se sabe)
function ultCambioDe(h, fila) {
  const d = S.cacheServ[h]; if (!d) return null;
  const c = d.cuentas.find(x => x.slots.some(sl => sl.row === Number(fila)));
  return c ? c.ultimoCambio || '' : null;
}
function textoUltCambio(u) {
  if (u === null) return 'Último cambio: buscando…';
  if (!u) return 'Último cambio: sin fecha anotada';
  const d = diasDesde(u);
  const hace = d == null ? '' : d === 0 ? ' · <span class="ult-hoy">hoy</span>' : d === 1 ? ' · ayer' : ` · hace ${d} días`;
  return `Último cambio: <span class="ult-f">${esc(u)}</span>${hace}`;
}
// Abrir el cambio de contraseña de la cuenta que tiene ese lugar
async function passDeLugar(h, fila) {
  const data = await cargarHoja(h);
  if (!data) return;
  const i = data.cuentas.findIndex(c => c.slots.some(sl => sl.row === Number(fila)));
  if (i < 0) return toast('No encontré esa cuenta. Tocá Actualizar.', true);
  if (!data.cuentas[i].passCol || !data.cuentas[i].infoRow) return toast('Esa cuenta no tiene contraseña cargada en la planilla.', true);
  abrirCambiarPass(i);
}

function haceCuanto(ts) {
  const min = Math.max(0, Math.round((Date.now() - ts) / 60000));
  if (min < 1) return 'recién';
  if (min < 60) return `hace ${min} min`;
  const h = Math.round(min / 60);
  return h < 24 ? `hace ${h} ${plural(h, 'hora', 'horas')}` : 'hace más de un día';
}
function renderPendientes() {
  const box = $('#pendCuerpo'); if (!box || !S.pend) return;
  let nCerrar = 0, nLiberar = 0;
  S.pend.forEach(h => h.cuentas.forEach(c => { if (c.slots.some(p => p.cerrar)) nCerrar++; nLiberar += c.slots.filter(p => !p.libre && (p.baja || p.noEsta)).length; }));
  const f = S.fPend;
  const chips = [['todo', 'Todo', ''], ['cerrar', 'Para cerrar', nCerrar], ['liberar', 'Para liberar', nLiberar]]
    .map(([k, lab, n]) => `<button class="chip" data-accion="f-pend" data-f="${k}" aria-pressed="${f === k}">${lab}${n !== '' ? ` <b>${n}</b>` : ''}</button>`).join('');
  const bloques = S.pend.map((h, hi) => {
    const cuentas = h.cuentas.map((c, ci) => {
      const lugares = c.slots.map((p, si) => ({ p, si })).filter(({ p }) =>
        f === 'todo' || (f === 'cerrar' ? p.cerrar : !p.libre && (p.baja || p.noEsta)));
      const tieneCerrar = c.slots.some(p => p.cerrar);
      if (!lugares.length && !(f === 'cerrar' && tieneCerrar)) return '';
      const filas = lugares.map(({ p, si }) => `<li class="pend-fila"><span><b>${p.libre ? 'Libre' : esc(p.usuario)}${p.cerrar ? '<span class="marca-cerrar">cerrar</span>' : ''}</b><small>${esc(txtPend(p))}</small></span>
        ${!p.libre && (p.baja || p.noEsta) && puede('liberarLugar') ? `<button class="btn btn-sm" data-accion="pend-liberar" data-h="${hi}" data-c="${ci}" data-s="${si}">Liberar</button>` : ''}</li>`).join('');
      return `<article class="cuenta">
        <header class="cuenta-cab"><div><h3>${esc(c.nombre || c.plan || 'Grupo')}</h3><p>${esc([c.nombre ? c.plan : '', c.correo].filter(Boolean).join(', '))}</p></div>
          <div class="pills">${tieneCerrar ? '<span class="pill cerrar">Cerrar</span>' : ''}</div></header>
        <ul class="lugares">${filas}</ul>
        <footer class="cuenta-pie">${tieneCerrar && c.passCol && c.infoRow && puede('cambiarPass') ? `<button class="acc acc-pass" data-accion="pend-pass" data-h="${hi}" data-c="${ci}">${ICON.llave}Cambiar contraseña</button>` : ''}${c.aviso ? `<button class="acc acc-aviso" data-accion="copiar-txt" data-t="${esc(c.aviso)}">${ICON.copiar}Copiar aviso</button>` : ''}</footer>
      </article>`;
    }).join('');
    if (!cuentas) return '';
    const liberables = h.cuentas.reduce((a, c) => a + c.slots.filter(p => !p.libre && (p.baja || p.noEsta)).length, 0);
    return `<section class="pend-hoja"><h3>${esc(h.hoja)}</h3>${cuentas}
      ${f !== 'cerrar' && liberables > 1 && puede('liberarLugar') ? `<button class="btn btn-bloque" data-accion="pend-liberar-hoja" data-h="${hi}">Liberar los ${liberables} de ${esc(h.hoja)}</button>` : ''}</section>`;
  }).join('');
  box.innerHTML = `<p class="pend-estado">Actualizado ${haceCuanto(S.pendTs || Date.now())}. <button class="link" data-accion="pend-ahora">Revisar ahora</button></p>` +
    `<div class="chips" role="group" aria-label="Filtrar pendientes">${chips}</div>` +
    (bloques || `<div class="vacio"><strong>Nada pendiente</strong>${f === 'cerrar' ? 'No hay cuentas marcadas para cerrar.' : f === 'liberar' ? 'No hay lugares de dados de baja.' : 'Todo al día.'}</div>`);
}
// Después de liberar o cerrar: sacar de la lista lo que ya no está pendiente
function limpiarPend() {
  S.pend.forEach(h => { h.cuentas.forEach(c => { c.slots = c.slots.filter(p => p.cerrar || (!p.libre && (p.baja || p.noEsta))); }); h.cuentas = h.cuentas.filter(c => c.slots.length); });
  S.pend = S.pend.filter(h => h.cuentas.length);
}
async function liberarPend(hi, lista) {
  const h = S.pend[hi];
  const nombres = lista.map(({ p }) => p.usuario);
  const texto = lista.length === 1
    ? `¿Liberar el lugar de <b>${esc(nombres[0])}</b> en ${esc(h.hoja)}? El cliente sigue en la base.`
    : `¿Liberar <b>${lista.length} lugares</b> en ${esc(h.hoja)}? Los clientes siguen en la base.`;
  if (!await confirmar(texto, 'Liberar', true)) return;
  try {
    const r = await api('liberarVarios', h.hoja, lista.map(({ p, c }) => ({ row: p.row, col: c.usuarioCol, nombre: p.usuario })), true);
    actualizarOcupacionFondo(h.hoja);
    if (r.servicio) mezclarServicio(h.hoja, r.servicio);
    else delete S.cacheServ[h.hoja];   // modo rápido: esa hoja se vuelve a leer la próxima vez que se abra
    S.resumenViejo = true;

/* Copia local de las últimas hojas abiertas: Cuentas abre al instante y se actualiza por detrás (hasta 12 hojas) */
const CLAVE_SERV = 'as_serv_v1';
const servLocales = {
  todo() { try { return JSON.parse(localStorage.getItem(CLAVE_SERV) || '{}'); } catch (e) { return {}; } },
  leer(h) { return this.todo()[h] || null; },
  guardar(h, data) {
    try {
      const t = this.todo();
      t[h] = { ts: Date.now(), data };
      const orden = () => Object.keys(t).sort((a, b) => t[b].ts - t[a].ts);
      orden().slice(12).forEach(k => delete t[k]);                // las 12 más recientes
      let txt = JSON.stringify(t);
      while (txt.length > 2500000 && Object.keys(t).length > 1) { delete t[orden().pop()]; txt = JSON.stringify(t); }
      localStorage.setItem(CLAVE_SERV, txt);
    } catch (e) { }
  },
  borrar() { try { localStorage.removeItem(CLAVE_SERV); } catch (e) { } }
};
// El servidor a veces devuelve solo la cuenta que cambió: se reemplaza esa y queda el resto
function mezclarServicio(hoja, data) {
  if (!data) return data;
  if (!data.parcial) { S.cacheServ[hoja] = data; delete S.servViejo[hoja]; servLocales.guardar(hoja, data); return data; }
  const actual = S.cacheServ[hoja];
  if (!actual) return data;
  for (const c of data.cuentas) {
    const i = actual.cuentas.findIndex(x => x.header === c.header);
    if (i >= 0) actual.cuentas[i] = c; else { delete S.cacheServ[hoja]; return data; }
  }
  if (!S.servViejo[hoja]) servLocales.guardar(hoja, actual);
  return data;
}

const enVuelo = {};
async function cargarHoja(h, forzar = false) {
  if (forzar) { delete S.cacheServ[h]; delete S.servViejo[h]; if (S.hojaSel === h) { renderCuentas(); return enVuelo[h]; } }
  if (S.hojaSel !== h) { S.hojaSel = h; renderCuentas(); return enVuelo[h] || S.cacheServ[h]; }
  if (S.cacheServ[h] && !S.servViejo[h]) return S.cacheServ[h];
  if (enVuelo[h]) return enVuelo[h];
  if (!S.cacheServ[h] && !forzar) {
    const loc = servLocales.leer(h);
    if (loc) { S.cacheServ[h] = loc.data; S.servViejo[h] = loc.ts; }
  }
  enVuelo[h] = api('getServicio', h).then(data => {
    S.cacheServ[h] = data; delete S.servViejo[h];
    servLocales.guardar(h, data);
    if (S.hojaSel === h) $('#listaCuentas') ? renderListaCuentas() : renderCuentas();
    return data;
  }).catch(e => {
    toast(msgError(e), true);
    if (S.hojaSel === h && !S.cacheServ[h]) $('#cuentasCuerpo').innerHTML = `<div class="vacio"><strong>No se pudo abrir ${esc(h)}</strong>${esc(msgError(e))}</div>`;
    return S.cacheServ[h] || null;
  }).finally(() => { delete enVuelo[h]; });
  if (S.servViejo[h] && S.hojaSel === h) renderCuentas();   // mostrar ya la copia guardada
  return enVuelo[h];
}

// Contraseña nueva para una cuenta: mismas reglas que el script de la planilla (Tigo Sports tiene la suya)
function generarPassCuenta(hoja) {
  const al = t => t.charAt(Math.floor(Math.random() * t.length));
  const MAY = 'ABCDEFGHJMNOPQRSTUVXYZ', MIN = 'abcdefghjmnpqrstuvxyz', NUM = '0123456789';
  if (hoja === 'Tigo Sports') { let p = al(MAY); for (let i = 0; i < 6; i++) p += al(MIN); return p + al(NUM) + '@'; }
  const SIL = ['ma', 'no', 'pe', 'li', 'ta', 'ro', 'su', 'va', 'ze', 'xu', 'bo', 'ne', 'fu', 'da'];
  let p = al(MAY); for (let i = 0; i < 5; i++) p += SIL[Math.floor(Math.random() * SIL.length)];
  return p + al(NUM);
}
const conTasker = hoja => (S.reglas.tasker || []).includes(hoja);

      <span class="pass-acc"><button class="link" type="button" data-accion="generar-pass" data-h="${esc(hoja)}">Generar otra</button><button class="link" type="button" data-accion="copiar-pass-nueva">Copiar</button></span>
      <span class="ayuda">Se guarda en la planilla. Cambiala vos en ${esc(hoja)}.</span></div>${fecha}`;

      ${pend.length ? `<p class="ayuda">Pendientes hasta que renueven: ${esc(pend.join(', '))}</p>` : ''}
      ${inv.length ? `<p class="ayuda">Teléfono inválido: ${esc(inv.join(', '))}</p>` : ''}
      ${fall.length ? `<p class="ayuda">Falló el envío a: ${esc(fall.join(', '))}</p>` : ''}
      <div class="pila"><button class="btn" data-accion="cerrar">Listo</button></div></div>`);
  } catch (e) { parar(); nota.textContent = ''; toast(msgError(e), true); b.disabled = false; b.textContent = 'Reintentar envío'; }

/* ================================================================

// Cuenta donde entró (la etiqueta de Gmail) -> color y nombre corto
const CUENTAS_PAGO = [
  ['familiar', 'Familiar'], ['interfisa', 'Interfisa'], ['continental', 'Continental'],
  ['mango', 'Mango'], ['personal', 'Personal'], ['itau', 'Itaú'], ['tigo', 'Tigo Money'], ['wally', 'Wally']
];
function cuentaPago(etiqueta) {
  const n = norm(etiqueta);
  const c = CUENTAS_PAGO.find(([k]) => n.includes(k));
  return c ? { k: c[0], nombre: c[1] } : { k: 'otra', nombre: tituloPalabras(etiqueta) || 'Otra' };
}
const MINUS = new Set(['de', 'del', 'la', 'las', 'los', 'y', 'e']);
function tituloPalabras(s) {
  return String(s || '').toLowerCase().replace(/\s*,\s*/g, ', ').split(/\s+/).filter(Boolean)
    .map((w, i) => {
      if (i && MINUS.has(w)) return w;
      if (w.length <= 3 && !/[aeiouáéíóú]/.test(w)) return w.toUpperCase();   // siglas: BNF, GNB
      return w.charAt(0).toUpperCase() + w.slice(1);
    }).join(' ');
}
const bancoPagador = s => tituloPalabras(String(s || '').replace(/\b(S\.?\s?A\.?(\s?E\.?(\s?C\.?\s?A\.?)?)?|SAECA|S\.A\.E\.C\.A\.)\s*$/i, '').replace(/[.,\s]+$/, ''));
function montoPago(t) {
  const m = String(t || '').match(/([A-Z]{3}|Gs\.?)?\s*([\d.,]+)/i);
  if (!m) return { moneda: 'PYG', n: 0 };
  const moneda = !m[1] || /^gs/i.test(m[1]) ? 'PYG' : m[1].toUpperCase();
  const n = moneda === 'PYG' ? Number(m[2].replace(/[.,]/g, '')) : Number(m[2].replace(/\./g, '').replace(',', '.'));
  return { moneda, n: n || 0 };
}
const textoMonto = p => p.moneda === 'PYG' ? 'Gs. ' + miles(p.n) : p.moneda + ' ' + p.n.toLocaleString('es-PY');
// Letras rotas que vienen de algunos correos del banco (UTF-8 leído como Windows-1252): "ACUÃ‘A" → "ACUÑA"
const CP1252 = '€\u0081‚ƒ„…†‡ˆ‰Š‹Œ\u008DŽ\u008F\u0090‘’“”•–—˜™š›œ\u009DžŸ';
function arreglarLetras(t) {
  t = String(t ?? '');
  if (/[ÃÂ][\u0080-\u00BF€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ]/.test(t)) {
    try {
      const bytes = Uint8Array.from([...t], ch => { const k = CP1252.indexOf(ch); const n = k >= 0 ? 0x80 + k : ch.charCodeAt(0); if (n > 255) throw 0; return n; });
      t = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
    } catch (e) { }
  }
  // Algunos bancos mandan la Ñ como "ÿ" o "¥" (otra tabla de letras): en nombres de acá siempre es Ñ
  return t.replace(/[ÿŸ¥¤]/g, (m, i) => { const a = t[i - 1] || ''; return a && a === a.toUpperCase() && a !== a.toLowerCase() ? 'Ñ' : 'ñ'; });
}
function decPago(a) {
  let [f, entidad, pagador, monto, etiqueta, id, extra, nroCuenta] = a;
  pagador = arreglarLetras(pagador); entidad = arreglarLetras(entidad);
  return { f, dia: f.slice(0, 10), hora: f.slice(11, 16), entidad, pagador, monto: montoPago(monto), cuenta: cuentaPago(etiqueta), etiqueta, id, extra: extra || '', nroCuenta: nroCuenta || '' };
}
// Debajo del nombre: la hora y el banco del que pagó (o el comprobante, si el aviso no trae banco)
function metaPago(p) {
  const partes = [p.hora];
  if (p.extra) partes.push(p.extra.replace(/^comprobante\s*/i, 'Comp. '));
  else if (p.entidad && !norm(p.entidad).includes(p.cuenta.k)) partes.push(bancoPagador(p.entidad));
  return partes.map(esc).join(' · ');
}
const DIAS_SEM = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
function etiquetaDia(dia, hoy) {
  const [a, m, d] = dia.split('-').map(Number), [a2, m2, d2] = hoy.split('-').map(Number);
  const dif = Math.round((Date.UTC(a2, m2 - 1, d2) - Date.UTC(a, m - 1, d)) / 864e5);
  if (dif === 0) return 'Hoy';
  if (dif === 1) return 'Ayer';
  return `${DIAS_SEM[new Date(Date.UTC(a, m - 1, d)).getUTCDay()]} ${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}`;
}
const CLAVE_TRANSF = 'as_transf_v1';
function guardarPagosLocal(r) { try { localStorage.setItem(CLAVE_TRANSF, JSON.stringify(r)); } catch (e) { } }
function leerPagosLocal() { try { return JSON.parse(localStorage.getItem(CLAVE_TRANSF) || 'null'); } catch (e) { return null; } }
function aplicarPagos(r) {
  S.pagosCrudo = r.lista;
  S.pagos = r.lista.map(decPago);
  S.pagosCarga = r.ultimaCarga || 0;
  S.pagosHoy = r.hoy || hoyDispositivo();

  S.pagosVinc = Object.assign({}, S.pagosVinc || {}, r.vinculos || {});
}
// Igual que en el servidor (norm_): sin tildes, minúsculas, solo letras y números
const clavePagador = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const usoDe = p => (S.pagosUsados || {})[p.id] || null;
const nombreCorto2 = n => soloNombre(n).split(' ').slice(0, 2).join(' ');
async function abrirPagos() {
  if (!S.pagos) {
    const loc = leerPagosLocal();
    if (loc) aplicarPagos(loc);
  }
  renderPagos();
  if (S.pagosLeyendo) return;
  if (S.pagos && S.pagosLeidoTs && Date.now() - S.pagosLeidoTs < 5 * 60000) return;   // leída hace menos de 5 minutos
  S.pagosLeyendo = true;
  try { const r = await api('getTransferencias'); aplicarPagos(r); guardarPagosLocal(r); S.pagosLeidoTs = Date.now(); if (S.vista === 'pagos') renderPagos(); }
  catch (e) { if (!S.pagos) $('#pagosCuerpo').innerHTML = `<div class="vacio"><strong>No se pudo leer</strong>${esc(msgError(e))}</div>`; }
  finally { S.pagosLeyendo = false; }
}
// Suma a la lista las transferencias que devolvió el script, sin esperar a releer la hoja
function sumarPagos(filas, r) {
  const base = (S.pagosCrudo || []).slice(), ids = new Set(base.map(x => x[5]));
  filas.forEach(f => { if (!ids.has(f[5])) { base.push(f); ids.add(f[5]); } });
  base.sort((a, b) => (a[0] < b[0] ? 1 : a[0] > b[0] ? -1 : 0));
  const todo = { lista: base.slice(0, 400), ultimaCarga: r.ultimaCarga, hoy: r.hoy, usados: S.pagosUsados || {}, vinculos: Object.assign({}, S.pagosVinc || {}, r.vinculos || {}) };
  aplicarPagos(todo); guardarPagosLocal(todo);
}
// Relee la hoja por detrás para quedar exactamente igual a la planilla
async function sincronizarPagos() {
  try { const r = await api('getTransferencias'); aplicarPagos(r); guardarPagosLocal(r); if (S.vista === 'pagos') renderPagos(); } catch (e) { }

// Buscador de Pagos: por nombre de quien pagó, monto, banco o cuenta
function coincidePago(p, q, qd) {
  if (!q) return true;
  const texto = norm([tituloPalabras(p.pagador), bancoPagador(p.entidad), p.cuenta.nombre, p.extra].join(' '));
  if (q.split(' ').every(t => texto.includes(t))) return true;
  return qd.length >= 3 && (String(p.monto.n).includes(qd) || digitos(p.extra).includes(qd));
}
function renderPagos() {

  const suma = l => ({ n: l.length, t: l.reduce((a, p) => a + (p.monto.moneda === 'PYG' ? p.monto.n : 0), 0) });
  const sumar = f => suma(S.pagos.filter(f));
  const ayer = (() => { const [a, m, d] = hoy.split('-').map(Number); return new Date(Date.UTC(a, m - 1, d - 1)).toISOString().slice(0, 10); })();
  const hace7 = (() => { const [a, m, d] = hoy.split('-').map(Number); return new Date(Date.UTC(a, m - 1, d - 6)).toISOString().slice(0, 10); })();
  const sHoy = sumar(p => p.dia === hoy), sAyer = sumar(p => p.dia === ayer), sSem = sumar(p => p.dia >= hace7);

// Clientes cuyo nombre se parece al de quien pagó (2 palabras o más en común)
function clientesParecidos(pagador) {
  const sacar = new Set(['de', 'del', 'la', 'las', 'los', 'y']);
  const tok = t => norm(soloNombre(t)).split(' ').filter(w => w.length > 2 && !sacar.has(w));
  const tp = new Set(tok(pagador));
  if (!tp.size) return [];
  return S.clientes.map(c => {
    const tc = tok(c.nombre); const comunes = tc.filter(w => tp.has(w)).length;
    return { c, comunes, ok: comunes >= 2 || (comunes === 1 && tc.length === 1 && tp.size === 1) };
  }).filter(x => x.ok)
    .sort((a, b) => b.comunes - a.comunes || (tipo(a.c) === 'baja') - (tipo(b.c) === 'baja') || a.c.dias - b.c.dias)
    .slice(0, 4).map(x => x.c);
}
// Sugerencias para una transferencia: primero a quién pagó antes, después nombre parecido y mismo monto
function sugerenciasPago(p) {
  const out = [], vistos = new Set();
  const poner = (c, motivo) => { if (c && !vistos.has(c.row)) { vistos.add(c.row); out.push({ c, motivo }); } };
  ((S.pagosVinc || {})[clavePagador(p.pagador)] || []).forEach(n => poner(S.clientes.find(c => c.nombre === n), 'Pagó por este cliente antes'));
  clientesParecidos(p.pagador).forEach(c => poner(c, 'Nombre parecido'));
  if (p.monto.moneda === 'PYG' && p.monto.n) S.clientes
    .filter(c => tipo(c) !== 'baja' && Number(c.monto) === p.monto.n && c.dias <= 3 && c.dias >= -30)
    .sort((x, y) => Math.abs(x.dias) - Math.abs(y.dias)).slice(0, 3)
    .forEach(c => poner(c, `Mismo monto, ${c.dias < 0 ? 'venció' : 'vence'} el ${dmy(c.venc).slice(0, 5)}`));
  return out.slice(0, 6);
}
function abrirPago(i) {
  const p = S.pagos[Number(i)]; if (!p) return;
  const [a, m, d] = p.dia.split('-').map(Number);
  const cuando = `${DIAS_SEM[new Date(Date.UTC(a, m - 1, d)).getUTCDay()]} ${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}/${a}, ${p.hora}`;
  const nombre = tituloPalabras(p.pagador) || 'Sin nombre';
  const filas = [
    ['Fecha y hora', cuando],
    ['Entró en', tituloPalabras(p.etiqueta) || p.cuenta.nombre],
    p.entidad && ['Pagó desde', bancoPagador(p.entidad)],
    p.nroCuenta && ['Cuenta de quien pagó', p.nroCuenta],
    p.extra && ['Comprobante', p.extra.replace(/^comprobante\s*/i, '')]
  ].filter(Boolean);
  const u = usoDe(p);
  S.pagoActual = p; S.pagoActualI = Number(i);
  const usada = u ? `<div class="aviso-usada">${ICON.ok}<span>Usada para <b>${esc(u.cliente)}</b><br><small>por ${esc(u.usuario)}, ${esc(fechaHoraCorta(u.ts))}</small></span>
      ${puede('destrabarPago') ? `<button class="link" data-accion="destrabar-pago">Destrabar</button>` : ''}</div>` : '';
  const sug = u ? [] : sugerenciasPago(p);
  const listaSug = sug.length ? `<h3 class="sub-tit">¿De qué cliente es?</h3>
    <ul class="lista">${sug.map(({ c, motivo }) => `<li class="fila"><button class="fila-main" data-accion="detalle" data-row="${c.row}">${badge(c)}<span class="fila-txt"><span class="nom">${nombreHTML(c.nombre)}</span><span class="sub">${esc(motivo)}</span></span></button>
      <span class="fila-acc"><button class="btn btn-sm btn-pri" data-accion="renovar-con-pago" data-row="${c.row}">${tipo(c) === 'baja' ? 'Reactivar' : 'Renovar'}</button></span></li>`).join('')}</ul>`
    : (u ? '' : '<p class="ayuda" style="margin:14px 2px 0">No encontré clientes que coincidan. Si es un cliente nuevo, crealo con el botón de abajo; si no, vinculala vos.</p>');
  hoja.abrir(`${cabHoja(nombre, '')}
    <div class="pago-detalle c-${p.cuenta.k}">
      <span class="cta-pill">${esc(p.cuenta.nombre)}</span>
      <div class="pago-grande">${esc(textoMonto(p.monto))}</div>
    </div>
    ${usada}
    <dl class="datos">${filas.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
    ${listaSug}
    <div class="pila" style="margin-top:16px">
      ${u ? '' : `<button class="btn" data-accion="vincular-pago">${ICON.gente}Vincular con otro cliente</button>
      <button class="btn${sug.length ? '' : ' btn-pri'}" data-accion="nuevo-con-pago">${ICON.mas}Es un cliente nuevo: crearlo</button>`}
      <button class="btn" data-accion="copiar-pago">${ICON.copiar}Copiar datos</button></div>`);
}
const fechaHoraCorta = ts => { const d = new Date(ts); return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const pagoParaServidor = p => ({ id: p.id, pagador: tituloPalabras(p.pagador), monto: p.monto.n });
// Nombre sugerido para el cliente nuevo: el de quien pagó (si el aviso del banco no trae un nombre real, queda vacío)
function nombreDePago(p) {
  const n = tituloPalabras(p.pagador || '');

}

function renderVincular(txt) {

function opcionesVinculo(row) {

async function guardarVinculo(row, usada) {
  const p = S.pagoActual, c = S.porRow.get(Number(row)); if (!p || !c) return;
  try {
    const r = await api('vincularPago', pagoParaServidor(p), c.nombre, !!usada);
    S.pagosVinc = Object.assign({}, S.pagosVinc || {}, r.vinculos || {});
    if (r.usados) S.pagosUsados = Object.assign({}, S.pagosUsados || {}, r.usados);
    guardarPagosLocal({ lista: S.pagosCrudo, ultimaCarga: S.pagosCarga, hoy: S.pagosHoy, usados: S.pagosUsados, vinculos: S.pagosVinc });
    toast(usada ? `Marcada como usada para ${soloNombre(c.nombre)}` : `Listo: ${tituloPalabras(p.pagador)} paga por ${soloNombre(c.nombre)}`);
    renderListaPagos(); abrirPago(S.pagoActualI);
  } catch (e) { toast(msgError(e), true); }
}
async function destrabarPagoActual() {
  const p = S.pagoActual, u = p && usoDe(p); if (!u) return;
  if (!await confirmar(`¿Destrabar esta transferencia? Hoy figura usada para <b>${esc(u.cliente)}</b>. Quedará libre para usarla de nuevo.`, 'Destrabar', true)) return;
  try {

    delete S.pagosUsados[p.id];
    guardarPagosLocal({ lista: S.pagosCrudo, ultimaCarga: S.pagosCarga, hoy: S.pagosHoy, usados: S.pagosUsados, vinculos: S.pagosVinc });

const TITULOS = { venc: 'Vencimientos', clientes: 'Clientes', pagos: 'Pagos', cuentas: 'Cuentas', nuevo: 'Nuevo cliente' };
/* Buscador de servicios del formulario: filtra los botones por nombre o por sus opciones (ej. "plus", "privado") */
function filtrarServ(inp) {
  const campo = inp.closest('.campo'), lista = campo && campo.querySelector('.sugs.dosfilas'); if (!lista) return;
  const q = norm(inp.value).replace(/ /g, ''), cat = catalogoServicios();
  let n = 0;
  lista.querySelectorAll('[data-accion="serv-grupo"]').forEach(b => {
    const g = cat[Number(b.dataset.g)];
    const ok = !q || norm([g.nombre, ...g.vars].join(' ')).replace(/ /g, '').includes(q);
    b.hidden = !ok; if (ok) n++;
  });
  lista.classList.toggle('filtrando', !!q);
  const mas = campo.querySelector('.ver-mas-sugs'); if (mas) mas.hidden = !!q;
  let vacio = campo.querySelector('.busca-vacio');
  if (q && !n) { if (!vacio) { vacio = document.createElement('p'); vacio.className = 'ayuda busca-vacio'; lista.after(vacio); } vacio.textContent = 'Ningún servicio con ese nombre. Podés escribirlo a mano en el campo de arriba.'; }
  else if (vacio) vacio.remove();
}
function limpiarBuscaServ(f) { const i = f && f.querySelector('[data-busca-serv]'); if (i && i.value) { i.value = ''; filtrarServ(i); } }

/*
 * En PC (o con mouse) las listas largas de botones (emojis y servicios del formulario) muestran dos líneas
 * y un "Ver todos" para desplegar el resto. Van primero las más usadas.
 */
const CON_MOUSE = matchMedia('(min-width:1024px), (hover:hover) and (pointer:fine)');
function plegarSugs(root = document) {
  if (!root || !CON_MOUSE.matches) return;
  root.querySelectorAll('.sugs.dosfilas:not([data-plegable])').forEach(el => {
    if (!el.offsetParent) return;   // oculta (otra vista): se revisa cuando se muestre
    el.dataset.plegable = '1';
    el.classList.add('plegado');
    if (el.scrollHeight <= el.clientHeight + 2) { el.classList.remove('plegado'); return; }
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'link ver-mas-sugs'; b.textContent = `Ver todos (${el.children.length}) ▾`;
    b.onclick = () => { const plegado = el.classList.toggle('plegado'); b.textContent = plegado ? `Ver todos (${el.children.length}) ▾` : 'Ver menos ▴'; };
    el.after(b);
  });
}
function cambiarVista(v) {
  S.vista = v; document.body.dataset.vista = v;   // en PC, Pagos y Nuevo usan una columna más angosta y centrada
  document.querySelectorAll('.vista').forEach(el => el.classList.toggle('activa', el.id === 'v-' + v));
  requestAnimationFrame(() => plegarSugs($('#v-' + v)));
  document.querySelectorAll('.tab').forEach(el => el.setAttribute('aria-selected', String(el.dataset.v === v)));
  $('#titulo').textContent = TITULOS[v];
  window.scrollTo(0, 0);
  if (!S.cargado) return;
  if (v === 'venc') renderVenc();
  if (v === 'clientes') renderClientes();
  if (v === 'cuentas') renderCuentas();
  if (v === 'pagos') abrirPagos();
  if (v === 'nuevo') { if (!$('#fNuevo') && !$('#nuevoCuerpo').innerHTML) renderNuevo(); $('#subtitulo').textContent = 'Se agrega al final de BasedeDatos'; }
}
function renderTodo() { renderVenc(); renderClientes(); renderCuentas(); if (S.vista === 'nuevo') $('#subtitulo').textContent = 'Se agrega al final de BasedeDatos'; }

/*
 * Copia local de los datos: la app abre al instante con lo último que vio y se
 * actualiza por detrás. Se borra al cerrar sesión.
 */
const CLAVE_DATOS = 'as_datos_v1';
const datosLocales = {
  leer() { try { return JSON.parse(localStorage.getItem(CLAVE_DATOS) || 'null'); } catch (e) { return null; } },
  // Si la memoria del navegador está llena (~5 MB), se borran las hojas de servicio guardadas (se vuelven a bajar solas) y se reintenta
  guardar(parte) {
    const txt = JSON.stringify(Object.assign(this.leer() || {}, parte));
    try { localStorage.setItem(CLAVE_DATOS, txt); }
    catch (e) { try { servLocales.borrar(); localStorage.setItem(CLAVE_DATOS, txt); } catch (e2) { console.warn('No se pudo guardar en el celular', e2); } }
  },
  // Los dados de baja se guardan compactos, como llegan del servidor (unas 3 veces más chicos)
  bajas(d) { d = d || this.leer(); return !d ? null : d.bajasC ? d.bajasC.map(expandirBaja) : d.bajas || null; },
  borrar() { try { localStorage.removeItem(CLAVE_DATOS); } catch (e) { } }
};
const hoyDispositivo = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
function horaDe(ts) {
  const d = new Date(ts), hh = d.toTimeString().slice(0, 5);
  return d.toDateString() === new Date().toDateString() ? 'de hoy ' + hh : 'del ' + d.toLocaleDateString('es-PY') + ' ' + hh;
}
function aplicarInicial(d, desfase = 0) {
  S.hoy = desfase ? hoyDispositivo() : d.hoy; S.leyenda = d.leyenda; S.msgs = d.msgs;
  S.usuario = d.usuario || S.usuario; S.rol = d.rol || ''; S.permisos = d.permisos || {}; S.reglas = d.reglas || S.reglas; mostrarUsuario();
  S.perfilAuto = d.perfilAuto !== false;
  S.clientes = d.clientes.map(dec);
  if (desfase) S.clientes.forEach(c => { if (typeof c.dias === 'number') c.dias -= desfase; });
  S.bajasCargadas = false;
  indexar();
  S.cargado = true;
}
// Una baja llega sin los datos que siempre son iguales ("~") ni los vacíos del final: se reconstruye completa
const BAJA_FIJOS = { 4: 'X', 12: 'CANCELADO', 13: null, 14: 'INACTIVO' };
function expandirBaja(f) {
  const e = f.slice();
  while (e.length < CAMPOS.length) e.push('');
  Object.keys(BAJA_FIJOS).forEach(i => { if (e[i] === '~') e[i] = BAJA_FIJOS[i]; });
  return e;
}
function sumarBajas(lista) {
  const nuevos = lista.map(dec).filter(c => !S.porRow.has(c.row));
  S.clientes = S.clientes.concat(nuevos);
  S.bajasCargadas = true;
  indexar();
  if (S.vista === 'clientes') renderClientes();
  const fn = $('#fNuevo');
  if (emojiAuto(fn) && fn.dataset.finAuto) aplicarEmoji(fn); else revisarExistentes(fn);
}

// Aviso visible mientras se sincroniza todo con la planilla (botón Actualizar)
const sync = {
  NOMBRES: { inicial: 'Clientes activos', bajas: 'Dados de baja', servicios: 'Hojas de servicio', resumen: 'Resumen del día' },
  pasos: null, tOcultar: 0,
  inicio() {
    clearTimeout(this.tOcultar);
    S.sincronizando = true;
    this.pasos = { inicial: 0, bajas: 0, servicios: 0, resumen: 0 };   // 0 = en curso, 1 = listo, -1 = falló
    const b = $('#btnActualizar'); b.classList.add('girando'); b.disabled = true;
    this.pintar();
  },
  marcar(k, ok) {
    if (!this.pasos || this.pasos[k] !== 0) return;
    this.pasos[k] = ok ? 1 : -1;
    if (Object.values(this.pasos).some(v => v === 0)) this.pintar(); else this.fin();
  },
  // si falla la lectura principal, los demás pasos no se llegan a pedir
  cortar() { if (!this.pasos) return; Object.keys(this.pasos).forEach(k => { if (this.pasos[k] === 0) this.pasos[k] = -1; }); this.fin(); },
  pintar() {
    const box = $('#sync');
    box.className = 'sync'; box.hidden = false;
    box.innerHTML = `<span class="sync-giro" aria-hidden="true"></span><span class="sync-txt"><b>Aguardá, sincronizando la base de datos…</b>
      <small>Puede tardar unos segundos. Mientras tanto podés seguir mirando.</small>
      <ul class="sync-pasos">${Object.entries(this.pasos).map(([k, v]) => `<li class="${v > 0 ? 'ok' : v < 0 ? 'mal' : ''}">${v > 0 ? '✓' : v < 0 ? '✕' : '…'} ${this.NOMBRES[k]}</li>`).join('')}</ul></span>`;
  },
  fin() {
    const malos = Object.keys(this.pasos).filter(k => this.pasos[k] < 0).map(k => this.NOMBRES[k].toLowerCase());
    const box = $('#sync'), d = new Date(), hora = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    box.className = 'sync ' + (malos.length ? 'con-error' : 'listo');
    box.innerHTML = `<span class="sync-ico" aria-hidden="true">${malos.length ? ICON.alerta || '' : ICON.ok}</span><span class="sync-txt">${malos.length
      ? `<b>Sincronizado en parte</b><small>No se pudo leer: ${esc(malos.join(', '))}. Tocá Actualizar para reintentar.</small>`
      : `<b>Todo sincronizado · ${hora}</b>`}</span>`;
    this.pasos = null; S.sincronizando = false;
    const b = $('#btnActualizar'); b.classList.remove('girando'); b.disabled = false;
    this.tOcultar = setTimeout(() => { box.hidden = true; }, malos.length ? 8000 : 3500);
  }
};

const SYNC_RECIENTE = 3 * 60000;   // al volver a entrar antes de esto, no se sincroniza de nuevo
async function cargar(forzar = false, silencioso = false) {
  const conAviso = forzar && !silencioso && S.cargado;
  if (conAviso) { if (S.sincronizando) return; sync.inicio(); }
  let lento, local = null;
  try {
    if (!S.cargado) {
      local = datosLocales.leer();
      if (local && local.inicial) {
        // Mostrar ya lo último guardado, corrigiendo los días si pasó la medianoche
        const [a1, m1, d1] = local.inicial.hoy.split('-').map(Number), [a2, m2, d2] = hoyDispositivo().split('-').map(Number);
        const desfase = Math.round((Date.UTC(a2, m2 - 1, d2) - Date.UTC(a1, m1 - 1, d1)) / 864e5);
        aplicarInicial(local.inicial, desfase);
        const bajasGuardadas = datosLocales.bajas(local);
        if (bajasGuardadas) sumarBajas(bajasGuardadas);
        if (local.servicios) { S.servicios = local.servicios; S.serviciosCargados = true; }
        if (local.resumen) S.resumen = local.resumen;
        cambiarVista(S.vista);
        ocultarSplash();
        // Volver a entrar enseguida (en Android, "atrás" cierra la app): si sincronizó hace menos de 3 minutos,
        // se usa lo guardado y no se le pide todo de nuevo a la planilla. Actualizar siempre fuerza.
        if (!forzar && local.ts && Date.now() - local.ts < SYNC_RECIENTE && bajasGuardadas) {
          $('#subtitulo').textContent = `Datos ${horaDe(local.ts)}`;
          return;
        }
        $('#subtitulo').textContent = `Datos ${horaDe(local.ts)}, actualizando…`;
      } else {
        $('#listaVenc').innerHTML = '<div class="esqueleto"></div>'.repeat(6);
        lento = setTimeout(() => { if (!S.cargado) $('#subtitulo').textContent = 'La planilla está tardando en responder…'; }, 12000);
      }
    }
    const d = await api('getInicial');
    const bajasPrevias = local && (local.bajasC || local.bajas);
    aplicarInicial(d);
    datosLocales.guardar({ inicial: d, ts: Date.now() });
    if (bajasPrevias) S.bajasCargadas = false;
    if (forzar) { S.cacheServ = {}; S.servViejo = {}; }
    cambiarVista(S.vista);
    ocultarSplash();
    if (forzar && !silencioso && !conAviso) toast('Datos actualizados');
    if (conAviso) sync.marcar('inicial', true);
    if (forzar || !S.resumen || Date.now() - (S.resumen.ts || 0) > 10 * 60000) pedirResumen().then(ok => { if (conAviso) sync.marcar('resumen', ok); });
    else if (conAviso) sync.marcar('resumen', true);

    // En segundo plano: la lista de hojas de servicio y los dados de baja.
    // La lista no se fuerza al tocar Actualizar: revisar las ~40 hojas tarda casi un minuto y casi nunca cambia
    // (el servidor la renueva sola cada 24 h; para una hoja nueva al instante, ejecutar probar() en el editor).
    api('getServiciosLista').then(lista => {
      if (conAviso) sync.marcar('servicios', true);
      S.servicios = lista; S.serviciosCargados = true;
      datosLocales.guardar({ servicios: lista });
      if (S.vista === 'cuentas') {
        if (S.asignando && !S.hojaSel) { const h = adivinarHoja(S.asignando.servicios); if (h) return cargarHoja(h); }
        forzar && S.hojaSel ? cargarHoja(S.hojaSel, true) : renderCuentas();
      }
    }).catch(e => { if (conAviso) sync.marcar('servicios', false); toast(msgError(e), true); });
    // Dados de baja: se manda la huella de la lista guardada; si no cambió, el servidor no la vuelve a mandar
    const guardadas = datosLocales.leer() || {};
    api('getBajas', (guardadas.bajasC || guardadas.bajas) && guardadas.bajasHuella ? guardadas.bajasHuella : '', 2).then(res => {
      if (conAviso) sync.marcar('bajas', true);
      let lista;
      if (Array.isArray(res)) { lista = res; datosLocales.guardar({ bajas: lista, bajasC: null, bajasHuella: '' }); }   // servidor viejo
      else if (res.sinCambios) lista = datosLocales.bajas() || [];
      else { lista = res.filas.map(expandirBaja); datosLocales.guardar({ bajasC: res.filas, bajas: null, bajasHuella: res.huella }); }
      sumarBajas(lista);
    }).catch(e => { if (conAviso) sync.marcar('bajas', false); toast('No se pudieron cargar los dados de baja: ' + msgError(e), true); });
  } catch (e) {
    ocultarSplash();
    if (conAviso) sync.cortar();
    if (!S.token) return;   // se venció la sesión: ya se muestra la pantalla de PIN
    if (S.cargado) {
      // Ya hay datos en pantalla: no se tapan con un error. Se avisa arriba y se vuelve a intentar solo en 1 minuto.
      const ts = (datosLocales.leer() || {}).ts;
      $('#subtitulo').textContent = `Sin actualizar${ts ? ' (datos ' + horaDe(ts) + ')' : ''}. Reintento en 1 min…`;
      if (!(e && e.red)) toast(msgError(e), true);   // los errores del servidor (no de conexión) sí se muestran
      clearTimeout(S.tReintento);
      S.tReintento = setTimeout(() => { S.tReintento = 0; if (S.token) cargar(false, true); }, 60000);
      return;
    }
    $('#subtitulo').textContent = 'No se pudo leer la planilla';
    $('#listaVenc').innerHTML = `<li class="vacio"><strong>No se pudo leer la planilla</strong>${esc(msgError(e))}<br><button class="btn mas" data-accion="actualizar">Reintentar</button></li>`;
  } finally { clearTimeout(lento); }
}

medirTop(); addEventListener('resize', medirTop);

// Modo presentación: difumina nombres, teléfonos, correos y contraseñas (solo se ve borroso; los datos y los botones siguen igual)
// Se tapa en parte, como en los bancos: "M•••• B••••", "+595 9•• ••• 123", "m••••@gmail.com". El texto original se guarda y vuelve al apagar.
const SEL_CENSURA = '.sx, .nom, .lugar-nom, .pago-t b, .pago-txt b, .usada-pill, .cred-item:first-child span, [data-pass], .cuenta-meta, .junto-cab b, .pend-fila b, .nuevo-res dd, .pago-nuevo b, .existe b, .pago-renovar b';
const PALABRAS_LIBRES = new Set(['usada', 'gs.', '·', '-', '—', 'y', 'de', 'del']);
function taparTexto(t) {
  if (!t.trim()) return t;
  // una sola pasada: correo | teléfono | palabra (así lo ya tapado no se vuelve a tapar)
  return t.replace(/([^\s@]+@[^\s@]+\.[^\s@]+)|(\+?\d[\d\s().-]{6,}\d)|([\p{L}\p{N}][\p{L}\p{N}.'’]*)/gu, (m, mail, tel, w) => {
    if (mail) { const [u, d] = mail.split('@'); return u.charAt(0) + '••••@' + d; }
    if (tel) { const d = tel.replace(/\D/g, ''); return d.startsWith('595') ? `+595 ${d.charAt(3)}•• ••• ${d.slice(-3)}` : `${d.charAt(0)}•• ••• ${d.slice(-3)}`; }
    if (PALABRAS_LIBRES.has(w.toLowerCase())) return w;
    if (/^\d+$/.test(w)) return '•'.repeat(Math.min(w.length, 4));   // PIN, ID, números sueltos
    return w.charAt(0) + '•'.repeat(Math.min(Math.max(w.length - 1, 2), 4));
  });
}
// Montos: "Gs. 30.000" en cualquier lado; y en los lugares de montos (totales, tablas, ficha) también "455.000" suelto
const SEL_MONTO = '.meta, .fila-t .num, .pago-t .monto, .pago-monto, .stat b, .dia-tit span, .pago-t-dia span, .datos dd, .previa, .junto-monto, .cb-dato, .pago-txt, .pago-renovar, .nuevo-res dd';
const taparMonto = (t, suelto) => t.replace(/(₲|Gs\.?)\s*-?\d[\d.,]*/g, '$1 •••••').replace(suelto ? /\b\d{1,3}(?:\.\d{3})+\b/g : /$^/, '•••.•••');
const tapados = new Map();   // nodo de texto → texto original
function taparEn(raiz) {
  if (!raiz || raiz.nodeType !== 1) return;
  const w = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT);
  for (let n = w.nextNode(); n; n = w.nextNode()) {
    const el = n.parentElement;
    if (!el || el.closest('script, style, svg, .nom-emoji, .toast')) continue;
    const orig = tapados.has(n) && n.data === tapados.get(n).tapado ? tapados.get(n).orig : n.data;
    let tap = taparMonto(orig, !!el.closest(SEL_MONTO));
    if (el.closest(SEL_CENSURA)) tap = taparTexto(tap);
    if (tap !== n.data) { tapados.set(n, { orig, tapado: tap }); n.data = tap; }
  }

const vigiaCensura = new MutationObserver(ms => ms.forEach(m => {
  if (m.type === 'characterData') { const n = m.target, x = tapados.get(n); if (!x || n.data !== x.tapado) { tapados.delete(n); taparEn(n.parentElement); } }
  else m.addedNodes.forEach(n => taparEn(n.nodeType === 3 ? n.parentElement : n));
}));
const censura = {
  activo() { try { return localStorage.getItem('as_censura') === '1'; } catch (e) { return false; } },
  aplicar(on) {
    try { on ? localStorage.setItem('as_censura', '1') : localStorage.removeItem('as_censura'); } catch (e) { }
    document.body.classList.toggle('censura', on);
    document.body.classList.toggle('tapado', on);
    if (on) { taparEn(document.body); vigiaCensura.observe(document.body, { childList: true, subtree: true, characterData: true }); }
    else { vigiaCensura.disconnect(); tapados.forEach((x, n) => { if (n.data === x.tapado) n.data = x.orig; }); tapados.clear(); }
    const b = $('#btnCensura'); b.innerHTML = on ? ICON.ojoNo : ICON.ojo; b.setAttribute('aria-pressed', String(on));
    b.title = on ? 'Modo presentación activado: tocá para mostrar los datos' : 'Modo presentación: ocultar datos de clientes';
  }
};
censura.aplicar(censura.activo());
$('#icoBusca').outerHTML = ICON.buscar;
$('#icoBuscaVenc').outerHTML = ICON.buscar;
$('#icoBuscaPagos').outerHTML = ICON.buscar;
pintarMarca();
pintarBotonTema();
pintarPin();
$('#linkAdmin').href = 'https://wa.me/' + WHATSAPP_ADMIN + '?text=' + encodeURIComponent('Hola, necesito mi PIN para la app de AccountStore.');
$('#pin').addEventListener('focus', () => $('#pinZona').classList.add('enfocado'));
$('#pin').addEventListener('blur', () => $('#pinZona').classList.remove('enfocado'));
S.token = sesionGuardada.get();
if (S.token) {
  S.usuario = infoSesion(S.token).usuario || '';
  mostrarSplash();
  if (huella.id() && !EN_APPS_SCRIPT) bloquear();
  cargar();
} else mostrarLogin();
if (!EN_APPS_SCRIPT && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => { });
}
</script>
